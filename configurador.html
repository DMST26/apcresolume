<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configurador APC mini mk2 ⇄ Resolume</title>
<style>
:root {
	--bg: #111214;
	--panel: #1a1c1f;
	--panel2: #22252a;
	--line: #30343a;
	--text: #e8e9eb;
	--dim: #9aa0a8;
	--accent: #ffb000;
	--err: #ff5a52;
	--warn: #ffc845;
	--ok: #4cd06a;
	--body: #2a2c30;
	--pad-off: #2e3034;
	--pad: 46px;
	--gap: 6px;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
	background: var(--bg); color: var(--text);
	font: 13px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
	display: flex; flex-direction: column;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
	background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
	padding: 6px 10px; cursor: pointer;
}
button:hover { border-color: #4a5058; }
button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
button.small { padding: 3px 7px; font-size: 12px; }
button:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=number], select, textarea {
	background: #0f1012; border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; width: 100%;
}
input[type=number] { width: 90px; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
label.check { display: flex; gap: 6px; align-items: center; cursor: pointer; }
h2 { font-size: 14px; margin: 0 0 10px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 16px 0 8px; }
p { margin: 6px 0; }
.dim { color: var(--dim); }
.err { color: var(--err); }
.warn { color: var(--warn); }
.ok { color: var(--ok); }
code { background: #0b0c0d; padding: 1px 4px; border-radius: 3px; font-size: 12px; }

/* ---------- barra superior ---------- */
header {
	display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
	padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
}
header .title { font-weight: 700; margin-right: 6px; white-space: nowrap; }
header .title span { color: var(--accent); }
header input.mapname { width: 260px; }
header .spacer { flex: 1; }

main { flex: 1; display: flex; min-height: 0; }
#left { flex: 1; overflow: auto; padding: 14px; min-width: 0; }
#right {
	width: 400px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--line);
	display: flex; flex-direction: column; min-height: 0;
}
@media (max-width: 980px) {
	main { flex-direction: column; overflow: auto; }
	#left { overflow: visible; }
	#right { width: auto; border-left: 0; border-top: 1px solid var(--line); }
	:root { --pad: 36px; --gap: 5px; }
}

/* ---------- vista previa ---------- */
.previewbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); padding: 5px 9px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: #111; }

/* ---------- el aparato ---------- */
.device {
	display: inline-grid; grid-template-columns: auto auto auto; gap: 10px 12px;
	background: var(--body); padding: 16px 18px 14px; border-radius: 14px;
	box-shadow: 0 8px 30px #0008, inset 0 1px 0 #ffffff10;
}
.rowlabels { display: grid; grid-template-rows: repeat(8, var(--pad)); gap: var(--gap); }
.rowlabels div { display: flex; align-items: center; gap: 4px; color: var(--dim); font-size: 11px; }
.rowlabels button { padding: 0 5px; font-size: 11px; line-height: 18px; }
.grid { display: grid; grid-template-columns: repeat(8, var(--pad)); grid-template-rows: repeat(8, var(--pad)); gap: var(--gap); }
.pad {
	position: relative; border-radius: 4px; background: var(--pad-off); cursor: pointer;
	border: 1px solid #00000060; overflow: hidden;
}
.pad .led, .btn .led { position: absolute; inset: 0; border-radius: inherit; }
.pad .lbl {
	position: absolute; left: 2px; right: 2px; bottom: 2px; font-size: 8.5px; line-height: 1.05;
	color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; pointer-events: none;
	display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.pad .ico { position: absolute; top: 2px; left: 3px; font-size: 9px; font-weight: 700; color: #fff; text-shadow: 0 0 3px #000; pointer-events: none; }
.pad .badge { position: absolute; top: 1px; right: 2px; font-size: 10px; pointer-events: none; text-shadow: 0 0 3px #000; }
.sel { outline: 2px solid var(--accent); outline-offset: 2px; z-index: 1; }
.side { display: grid; grid-template-rows: repeat(8, var(--pad)); gap: var(--gap); align-items: center; }
.btn {
	position: relative; width: calc(var(--pad) * .62); height: calc(var(--pad) * .34);
	background: #3a3c41; border-radius: 3px; cursor: pointer; border: 1px solid #0007;
}
.btn .blbl { position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 10px; color: var(--dim); pointer-events: none; }
.bottomrow { grid-column: 2; display: grid; grid-template-columns: repeat(8, var(--pad)); gap: var(--gap); justify-items: center; }
.bottomrow .btn .blbl { left: 50%; top: calc(100% + 3px); transform: translateX(-50%); max-width: calc(var(--pad) + var(--gap)); overflow: hidden; text-overflow: ellipsis; font-size: 9px; }
.faders { grid-column: 2 / span 2; display: grid; grid-template-columns: repeat(8, var(--pad)) auto; gap: var(--gap); margin-top: 14px; }
.fader { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 4px 0; border-radius: 6px; }
.fader .track { width: 6px; height: 74px; background: #0c0d0e; border-radius: 3px; position: relative; }
.fader .knob { position: absolute; left: 50%; top: 40%; width: 26px; height: 12px; transform: translateX(-50%); background: #d6d7da; border-radius: 2px; box-shadow: 0 2px 4px #0009; }
.fader .flbl { font-size: 9px; color: var(--dim); text-align: center; line-height: 1.1; height: 22px; overflow: hidden; width: calc(var(--pad) + 4px); }
.fader .fnum { font-size: 10px; color: var(--dim); }
.fader.none .knob { background: #6b6e74; }
.shiftbox { grid-column: 3; grid-row: 2; display: flex; flex-direction: column; justify-content: flex-start; gap: 4px; align-items: flex-start; }
.brand { grid-column: 1 / span 3; display: flex; justify-content: space-between; color: #8c9097; font-size: 11px; letter-spacing: .08em; }

/* LEDs: brillo y animaciones (la duración la pone el script según el BPM) */
@keyframes pulse { 0%, 100% { opacity: .12; } 50% { opacity: 1; } }
@keyframes blink { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
.led.pulse { animation-name: pulse; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
.led.blink { animation-name: blink; animation-timing-function: linear; animation-iteration-count: infinite; }

/* ---------- avisos ---------- */
#warnings { margin-top: 16px; max-width: 760px; }
#warnings .item { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 5px; background: var(--panel); margin-bottom: 4px; }
#warnings .item .msg { flex: 1; }
#warnings .item button { flex-shrink: 0; }

/* ---------- panel derecho ---------- */
.tabs { display: flex; border-bottom: 1px solid var(--line); flex-shrink: 0; overflow-x: auto; }
.tabs button { border: 0; border-radius: 0; background: none; padding: 10px 12px; color: var(--dim); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.tabpane { flex: 1; overflow: auto; padding: 14px; display: none; }
.tabpane.on { display: block; }
.field { margin-bottom: 10px; }
.field > label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 3px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 0; }
.row > .fixed { flex: 0 0 auto; }
.hint { font-size: 12px; color: var(--dim); margin-top: 3px; }
.box { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
.namecheck { font-size: 12px; margin-top: 4px; }

.palette { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; }
.palette div { aspect-ratio: 1; border-radius: 2px; cursor: pointer; border: 1px solid #0006; }
.palette div.on { outline: 2px solid #fff; outline-offset: 1px; z-index: 1; position: relative; }
.quick { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
.quick div { width: 26px; height: 26px; border-radius: 4px; cursor: pointer; border: 1px solid #0006; position: relative; }
.quick div.on { outline: 2px solid #fff; outline-offset: 1px; }
.quick div span { position: absolute; bottom: -1px; right: 1px; font-size: 8px; color: #000a; font-weight: 700; }

.ledstate { display: grid; grid-template-columns: 110px 1fr 34px; gap: 8px; align-items: center; margin-bottom: 6px; }
.ledstate .sw { width: 34px; height: 24px; border-radius: 4px; background: var(--pad-off); position: relative; overflow: hidden; }

dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 18px; width: min(460px, 94vw); }
dialog::backdrop { background: #000a; }
.toast {
	position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #2b2e33; border: 1px solid var(--line);
	padding: 9px 14px; border-radius: 8px; box-shadow: 0 6px 20px #000a; z-index: 10; max-width: 90vw;
}
.toast.err { border-color: var(--err); }
.help li { margin-bottom: 6px; }
</style>
</head>
<body>
<header>
	<div class="title">APC mini mk2 <span>⇄</span> Resolume</div>
	<input class="mapname" id="mapName" type="text" title="Nombre del mapa (club o evento)">
	<button id="btnOpen" title="Abrir un mapa guardado (.json)">Abrir mapa…</button>
	<button id="btnSave" title="Descargar el mapa como .json">Guardar mapa</button>
	<button id="btnUndo" title="Deshacer (Ctrl+Z)">↶</button>
	<button id="btnRedo" title="Rehacer (Ctrl+Y)">↷</button>
	<span class="spacer"></span>
	<button class="primary" id="btnExport">Exportar para Chataigne</button>
	<input type="file" id="fileOpen" accept=".json,application/json" hidden>
	<input type="file" id="fileComp" accept=".json,application/json" hidden>
</header>
<main>
	<section id="left">
		<div class="previewbar">
			<span class="dim">Vista previa:</span>
			<div class="seg" id="previewSeg">
				<button data-mode="empty">Vacíos</button>
				<button data-mode="loaded">Cargados</button>
				<button data-mode="active">Sonando</button>
				<button data-mode="mixed">Mezcla</button>
				<button data-mode="show">Simular show</button>
			</div>
			<label class="row fixed" style="gap:6px">BPM <input type="number" id="bpm" min="40" max="300" step="1" style="width:70px"></label>
			<span class="dim" style="font-size:12px">Clic: elegir · Ctrl/Mayús + clic: elegir varios</span>
		</div>
		<div class="device" id="device"></div>
		<div id="warnings"></div>
	</section>
	<aside id="right">
		<nav class="tabs" id="tabs">
			<button data-tab="ctl" class="on">Control</button>
			<button data-tab="res">Resolume</button>
			<button data-tab="opt">Opciones</button>
			<button data-tab="exp">Exportar</button>
			<button data-tab="help">Ayuda</button>
		</nav>
		<div class="tabpane on" id="tab-ctl"></div>
		<div class="tabpane" id="tab-res"></div>
		<div class="tabpane" id="tab-opt"></div>
		<div class="tabpane" id="tab-exp"></div>
		<div class="tabpane help" id="tab-help"></div>
	</aside>
</main>

<dialog id="tplDialog"></dialog>

<script>// Generador compartido por configurador.html (navegador) y build.js (Node):
// normaliza y valida el mapa, genera los scripts de Chataigne, el .noisette y el ZIP.
(function (G) {
	"use strict";

	G.PAD_TYPES = ["none", "clip", "dual", "osc", "midi", "rgb", "tap", "resync", "bypass", "blackout", "clear", "clearAll", "prev", "next", "refresh"];
	G.BUTTON_TYPES = ["none", "bypass", "clear", "blackout", "clearAll", "prev", "next", "refresh", "tap", "resync", "osc", "midi"];
	G.FADER_TYPES = ["none", "layerOpacity", "layerMaster", "compMaster", "compOpacity", "osc", "midiCC", "clipSpeed"];
	G.MAX_EXTRA = 4;
	// nombres de módulo que ya usa el puente y no pueden ser destinos nuevos
	G.RESERVED_TARGETS = ["apc", "resolume", "resolumeapi", "resolumews"];
	G.CONFIG_MARKER = "var EMBEDDED_CONFIG = null; // @@CONFIG@@";
	G.SCRIPT_NAMES = ["apc_to_resolume.js", "resolume_to_apc.js", "resolume_api.js"];

	function int(v, def, min, max) {
		var n = parseInt(v, 10);
		if (isNaN(n)) n = def;
		if (min !== undefined && n < min) n = min;
		if (max !== undefined && n > max) n = max;
		return n;
	}
	function num(v, def) {
		var n = parseFloat(v);
		return isNaN(n) ? def : n;
	}
	function layerList(v, fallback) {
		var arr = Array.isArray(v) ? v : String(v === undefined ? "" : v).split(",");
		var out = [];
		arr.forEach(function (x) { var n = parseInt(x, 10); if (n > 0 && out.indexOf(n) < 0) out.push(n); });
		if (!out.length && fallback) out.push(fallback);
		return out;
	}
	G.layerList = layerList;

	function normPadLed(led) {
		led = led || {};
		return { empty: int(led.empty, 0, 0, 16), loaded: int(led.loaded, 0, 0, 16), active: int(led.active, 0, 0, 16) };
	}
	function normButtonLed(led) {
		led = led || {};
		return { idle: int(led.idle, 0, 0, 2), active: int(led.active, 1, 0, 2) };
	}

	// Deja cada control con todos los campos que leen los scripts (y solo esos).
	function normControl(d, isPad) {
		d = d || {};
		var types = isPad ? G.PAD_TYPES : G.BUTTON_TYPES;
		var t = types.indexOf(d.type) >= 0 ? d.type : "none";
		var o = { type: t, label: String(d.label || "") };
		if (t == "clip" || t == "dual") {
			o.layer = int(d.layer, 1, 1); o.clip = int(d.clip, 1, 1); o.name = String(d.name || "");
		}
		if (t == "dual") {
			o.layer2 = int(d.layer2, 1, 1); o.clip2 = int(d.clip2, 1, 1); o.name2 = String(d.name2 || "");
		}
		if (t == "rgb") o.rgb = ["r", "g", "b"].indexOf(d.rgb) >= 0 ? d.rgb : "r";
		if (t == "osc" || t == "midi") copyAction(o, d, t);
		if (d.extra && d.extra.length) {
			o.extra = [];
			d.extra.slice(0, G.MAX_EXTRA).forEach(function (a) {
				var x = { type: a.type == "midi" ? "midi" : "osc" };
				copyAction(x, a, x.type);
				o.extra.push(x);
			});
		}
		if (t == "bypass" || t == "clear") o.layers = layerList(d.layers, 1);
		if (t == "prev" || t == "next") o.layer = int(d.layer, 1, 1);
		if (isPad) {
			o.color = int(d.color, 0, 0, 127);
			o.led = normPadLed(d.led);
		} else {
			o.led = normButtonLed(d.led);
		}
		return o;
	}

	// Campos de una acción OSC o MIDI (la principal de un control o una extra).
	function copyAction(o, d, t) {
		o.target = String(d.target || (t == "osc" ? "resolume" : ""));
		o.mode = ["pulse", "hold", "toggle"].indexOf(d.mode) >= 0 ? d.mode : "pulse";
		if (t == "osc") {
			o.address = String(d.address || "/");
			o.value = num(d.value, 1);
		} else {
			o.msg = ["note", "cc", "pc"].indexOf(d.msg) >= 0 ? d.msg : "note";
			o.channel = int(d.channel, 1, 1, 16);
			o.number = int(d.number, 0, 0, 127);
			o.value = int(d.value, 127, 0, 127);
		}
	}

	function normTarget(t) {
		t = t || {};
		var o = {
			id: String(t.id || "").toLowerCase().split("").filter(function (ch) { return /[a-z0-9]/.test(ch); }).join(""),
			type: t.type == "osc" ? "osc" : "midi",
			label: String(t.label || "")
		};
		if (o.type == "osc") { o.host = String(t.host || "127.0.0.1"); o.port = int(t.port, 8000, 1, 65535); }
		else o.device = String(t.device || "");
		return o;
	}

	function normFader(f) {
		f = f || {};
		var t = G.FADER_TYPES.indexOf(f.type) >= 0 ? f.type : "none";
		var o = { type: t, label: String(f.label || "") };
		if (t == "layerOpacity" || t == "layerMaster" || t == "clipSpeed") o.layer = int(f.layer, 1, 1);
		if (t == "clipSpeed") {
			o.clip = int(f.clip, 1, 1);
			o.min = num(f.min, 0.25); o.max = num(f.max, 4);
			if (o.min <= 0) o.min = 0.25;
			if (o.max <= 0) o.max = 4;
			o.name = String(f.name || "");
		}
		if (t == "osc") { o.target = String(f.target || "resolume"); o.address = String(f.address || "/"); o.min = num(f.min, 0); o.max = num(f.max, 1); }
		if (t == "midiCC") {
			o.target = String(f.target || ""); o.channel = int(f.channel, 1, 1, 16); o.number = int(f.number, 0, 0, 127);
			o.min = int(f.min, 0, 0, 127); o.max = int(f.max, 127, 0, 127);
		}
		return o;
	}

	G.normalizeConfig = function (c) {
		c = c || {};
		var i, out = {
			format: "apc-resolume",
			version: 1,
			name: String(c.name || "Sin nombre"),
			resolume: {
				host: String((c.resolume && c.resolume.host) || "127.0.0.1"),
				apiPort: int(c.resolume && c.resolume.apiPort, 8080, 1, 65535)
			},
			layers: {},
			targets: [],
			pads: [], bottom: [], side: [],
			shift: null, faders: [],
			options: {}
		};
		var L = c.layers || {};
		Object.keys(L).forEach(function (k) { if (parseInt(k, 10) > 0 && L[k]) out.layers[String(parseInt(k, 10))] = String(L[k]); });
		(c.targets || []).forEach(function (t) {
			var n = normTarget(t);
			if (n.id && G.RESERVED_TARGETS.indexOf(n.id) < 0 && !out.targets.some(function (x) { return x.id == n.id; })) out.targets.push(n);
		});
		for (i = 0; i < 64; i++) out.pads.push(normControl(c.pads && c.pads[i], true));
		for (i = 0; i < 8; i++) out.bottom.push(normControl(c.bottom && c.bottom[i], false));
		for (i = 0; i < 8; i++) out.side.push(normControl(c.side && c.side[i], false));
		out.shift = normControl(c.shift, false);
		for (i = 0; i < 9; i++) out.faders.push(normFader(c.faders && c.faders[i]));
		var op = c.options || {};
		out.options = {
			tempoSync: op.tempoSync !== false,
			pollHz: num(op.pollHz, 1),
			repaintEvery: int(op.repaintEvery, 5, 1),
			rgbHz: num(op.rgbHz, 5),
			speedMethod: op.speedMethod == "websocket" ? "websocket" : "put",
			autoReload: op.autoReload !== false,
			debug: !!op.debug
		};
		if (out.options.pollHz <= 0) out.options.pollHz = 1;
		if (out.options.rgbHz <= 0) out.options.rgbHz = 5;
		return out;
	};

	// Avisos para el usuario: [{level: "error"|"aviso", msg, ref}]
	G.validateConfig = function (c, composition) {
		var res = [];
		function add(level, msg, ref) { res.push({ level: level, msg: msg, ref: ref }); }
		function oscOk(a) { return typeof a == "string" && a.charAt(0) == "/" && a.length > 1 && a.indexOf(" ") < 0; }
		var ids = ["resolume"].concat(c.targets.map(function (t) { return t.id; }));
		function checkAction(a, where, ref) {
			if (!a || (a.type != "osc" && a.type != "midi")) return;
			if (a.type == "osc" && !oscOk(a.address)) add("error", where + ": la dirección OSC tiene que empezar por / y no llevar espacios", ref);
			if (a.type == "midi" && !a.target) add("error", where + ": falta elegir el destino MIDI", ref);
			else if (ids.indexOf(a.target) < 0) add("error", where + ": el destino «" + a.target + "» no existe (pestaña Destinos)", ref);
			else if (a.type == "midi" && targetType(a.target) != "midi") add("error", where + ": «" + a.target + "» es un destino OSC, no MIDI", ref);
			else if (a.type == "osc" && a.target != "resolume" && targetType(a.target) != "osc") add("error", where + ": «" + a.target + "» es un destino MIDI, no OSC", ref);
		}
		function targetType(id) { for (var i = 0; i < c.targets.length; i++) if (c.targets[i].id == id) return c.targets[i].type; return id == "resolume" ? "osc" : ""; }
		function checkControl(d, where, ref) {
			checkAction(d, where, ref);
			(d.extra || []).forEach(function (a, k) { checkAction(a, where + " (extra " + (k + 1) + ")", ref); });
		}
		c.pads.forEach(function (d, i) { checkControl(d, G.padName(i), { pad: i }); });
		[["bottom", "Botón de abajo "], ["side", "Botón lateral "]].forEach(function (g) {

		c.faders.forEach(function (f, i) {
			if (f.type == "osc" || f.type == "midiCC") checkAction({ type: f.type == "osc" ? "osc" : "midi", target: f.target, address: f.address }, "Fader " + (i + 1), { fader: i });
		});

		c.pads.forEach(function (d, i) {
			var where = G.padName(i);
			if ((d.type == "clip" || d.type == "dual")) {
				var k = d.layer + "/" + d.clip;
				if (seen[k] !== undefined) add("aviso", where + " lanza el mismo clip que " + G.padName(seen[k]) + " (capa " + d.layer + ", clip " + d.clip + ")", { pad: i });

			if (f.type == "clipSpeed" && f.min >= f.max) add("error", "Fader " + (i + 1) + ": la velocidad mínima tiene que ser menor que la máxima", { fader: i });

	G.padName = function (i) { return "Pad fila " + (Math.floor(i / 8) + 1) + " · " + ((i % 8) + 1); };

	// ---------- composición de Resolume ----------

	// Convierte la respuesta de /api/v1/composition en {layers: [{name, clips: [{name, empty}]}], name}
	G.parseComposition = function (json) {

	};

	// Busca el clip por nombre en la capa: devuelve su número o 0.
	G.findClip = function (comp, layer, name) {

	// Compara los nombres guardados en el mapa con los de la composición.
	G.checkNames = function (c, comp) {

		function one(where, ref, layer, clip, saved, which) {

			if (d.type == "dual") one(G.padName(i) + " (2.º clip)", { pad: i }, d.layer2, d.clip2, d.name2, 2);
		});
		c.faders.forEach(function (f, i) {
			if (f.type == "clipSpeed") one("Fader " + (i + 1), { fader: i }, f.layer, f.clip, f.name, 1);
		});
		return res;
	};

	// ---------- exportar ----------

	G.configJSON = function (c) { return JSON.stringify(c, null, 1) + "\n"; };

	G.buildScript = function (template, c) {
		if (template.indexOf(G.CONFIG_MARKER) < 0) throw new Error("La plantilla del script no tiene la marca del mapa");
		var json = JSON.stringify(c);
		return template.replace(G.CONFIG_MARKER, function () {
			return "var EMBEDDED_CONFIG = " + json + "; // mapa incluido: \"" + c.name.split("\"").join("'") + "\"";
		});
	};

	// .noisette a partir del que ya funciona: cambia la ruta de los scripts y añade el módulo
	// WebSocket "resolumews" si no está. Todo lo demás se deja tal cual.
	G.buildNoisette = function (template, folder, targets) {
		var n = JSON.parse(JSON.stringify(template));
		folder = String(folder || "").split("\\").join("/").replace(/\/+$/, "");
		var SCRIPT_OF = { apc: "apc_to_resolume", resolume: "resolume_to_apc", resolumeapi: "resolume_api" };
		var hasWs = false;
		n.modules.items.forEach(function (m) {
			if (m.niceName == "resolumews") hasWs = true;
			var s = SCRIPT_OF[m.niceName];
			if (!s || !m.scripts || !m.scripts.items) return;
			m.scripts.items.forEach(function (it) {
				if (it.niceName != s) return;
				it.parameters.forEach(function (p) { if (p.controlAddress == "/filePath") p.value = folder + "/" + s + ".js"; });
			});
		});
		if (!hasWs) n.modules.items.push(G.WS_MODULE());
		(targets || []).forEach(function (t, i) {
			if (n.modules.items.some(function (m) { return m.niceName == t.id; })) return;
			n.modules.items.push(t.type == "osc" ? G.OSC_TARGET_MODULE(t, 9100 + i) : G.MIDI_TARGET_MODULE(t));
		});
		return JSON.stringify(n);
	};

	// Módulo MIDI de un destino. El puerto se elige en Chataigne (los ids de Windows no se pueden adivinar).
	G.MIDI_TARGET_MODULE = function (t) {
		return {
			parameters: [{ value: true, controlAddress: "/enabled" }],
			niceName: t.id,
			type: "MIDI",
			params: { parameters: [{ value: false, controlAddress: "/autoAdd" }], containers: { pass_through: {} } },
			templates: { viewOffset: [0, 0], viewZoom: 1.0 },
			values: {}
		};
	};

	G.OSC_TARGET_MODULE = function (t, listenPort) {
		return {
			parameters: [{ value: true, controlAddress: "/enabled" }],
			niceName: t.id,
			type: "OSC",
			params: {
				parameters: [{ value: "Auto", controlAddress: "/networkInterface" }],
				containers: {
					oscInput: { parameters: [{ value: listenPort, hexMode: false, controlAddress: "/localPort" }] },
					oscOutputs: {
						items: [{
							parameters: [

							niceName: "OSC Output", type: "BaseItem"
						}],
						viewOffset: [0, 0], viewZoom: 1.0
					},
					pass_through: {}
				}
			},
			templates: { viewOffset: [0, 0], viewZoom: 1.0 },
			values: {}
		};
	};

	G.WS_MODULE = function () {
		return {
			parameters: [{ value: true, controlAddress: "/enabled" }],
			niceName: "resolumews",
			type: "WebSocket Client",
			params: {
				parameters: [
					{ value: "Direct", controlAddress: "/protocol" },

					{ value: "127.0.0.1:8080/api/v1", controlAddress: "/serverPath" }

			templates: { viewOffset: [0, 0], viewZoom: 1.0 },
			values: {}
		};
	};

	// Todos los archivos que van a la carpeta de Chataigne: [{name, text}]
	G.buildFiles = function (c, templates, noisetteTemplate, opts) {
		opts = opts || {};
		var files = [{ name: "apc_config.json", text: G.configJSON(c) }];
		if (opts.scripts !== false) G.SCRIPT_NAMES.forEach(function (n) { files.push({ name: n, text: G.buildScript(templates[n], c) }); });
		if (opts.noisette && noisetteTemplate) files.push({ name: "APC_Resolume.noisette", text: G.buildNoisette(noisetteTemplate, opts.folder, c.targets) });

	};

	// ZIP sin compresión (suficiente para unos pocos archivos de texto)
	var CRC_TABLE = null;

			v.setUint16(26, name.length, true); v.setUint16(28, 0, true);
			h.b.set(name, 30);
			var ch = hdr(46 + name.length), cv = new DataView(ch.b.buffer);
			cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
			cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, time, true); cv.setUint16(14, date, true);
			cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);

,"scripts":{"apc_to_resolume.js":"// APC mini mk2 -> Resolume (OSC)\n// Script del módulo MIDI \"apc\". Lo que pulsas en el APC sale por OSC al módulo \"resolume\".\n//\n// Este script NO lleva el mapa dentro: lo lee de apc_config.json, en la misma carpeta que\n// el script. El mapa se edita con configurador.html. Si no encuentra el archivo, usa el mapa\n// que el configurador dejó incluido al exportar (EMBEDDED_CONFIG).\n//\n// Además de Resolume, cualquier control puede mandar OSC o MIDI a otros módulos de Chataigne\n// (\"destinos\" del mapa, por ejemplo un módulo MIDI \"sunlite\" con un puerto loopMIDI).\n//\n// Notas del APC: pads 0-63 (0 = abajo a la izquierda), botones de abajo 100-107,\n// laterales 112-119 (112 = arriba), shift 122, faders CC 48-56.\n//\n// Generado por el configurador APC mini mk2 <-> Resolume. Motor JS de Chataigne: sin let,\n// sin funciones flecha, sin expresiones regulares.\n\nvar CONFIG_FILE = \"apc_config.json\";\nvar EMBEDDED_CONFIG = null; // @@CONFIG@@\n\nvar cfg = null;\nvar cfgText = \"\";\nvar reloadTime = 0;\n\nvar TRACK_FIRST = 100; // botones de abajo 100-107\nvar SCENE_FIRST = 112; // botones laterales 112-119 (112 = arriba)\nvar SHIFT = 122;\nvar FADER_FIRST = 48;  // CC 48-55 faders, 56 master\n\nvar COLORS8 = [3, 5, 9, 13, 21, 37, 45, 53]; // para \"Test LEDs\"\n\nvar bypassed = [];     // por capa: 1 = bypass puesto desde el APC\nfor (var q = 0; q < 100; q++) bypassed.push(0);\nvar blackout = 0;\nvar oscToggle = [];    // por nota: estado de los controles OSC/MIDI en modo interruptor\nfor (var q2 = 0; q2 < 128; q2++) oscToggle.push(0);\nvar extraToggle = [];  // nota * 4 + n: estado de las acciones extra en modo interruptor\nfor (var q3 = 0; q3 < 512; q3++) extraToggle.push(0);\nvar MAX_EXTRA = 4;\nvar warnedTargets = [];\nvar pendingSpeed = [-1, -1, -1, -1, -1, -1, -1, -1, -1]; // fader -> velocidad por enviar\nvar lastSpeed = [-1, -1, -1, -1, -1, -1, -1, -1, -1];\n\nvar testLeds = script.addTrigger(\"Test LEDs\", \"Enciende todos los pads para comprobar que llega el MIDI al APC\");\nvar clearLeds = script.addTrigger(\"Refresh LEDs\", \"Apaga y pide el estado a Resolume\");\nvar reloadMap = script.addTrigger(\"Recargar mapa\", \"Vuelve a leer apc_config.json\");\n\nfunction resolume() { return root.modules.resolume; }\nfunction api() { return root.modules.resolumeapi; }\n\n// Módulo de Chataigne al que va una acción OSC o MIDI. Sin destino = \"resolume\".\nfunction target(id) {\n\tif (!id || id == \"resolume\") return root.modules.resolume;\n\tvar m = root.modules[id];\n\tif (!m) {\n\t\tfor (var i = 0; i < warnedTargets.length; i++) if (warnedTargets[i] == id) return m;\n\t\twarnedTargets.push(id);\n\t\tscript.logError(\"No existe el módulo \\\"\" + id + \"\\\" en Chataigne. Créalo con ese nombre (lo usa el mapa como destino).\");\n\t}\n\treturn m;\n}\n\n// Manda una acción OSC o MIDI: on = 1 al activar, 0 al desactivar.\n//   OSC: valor o 0. Nota: note on con su velocity o note off. CC: valor o 0. Program change: solo al activar.\nfunction sendOut(a, on) {\n\tvar m = target(a.target);\n\tif (!m) return;\n\tif (a.type == \"osc\") { m.send(a.address, on ? a.value : 0); return; }\n\tif (a.msg == \"cc\") m.sendCC(a.channel, a.number, on ? a.value : 0);\n\telse if (a.msg == \"pc\") { if (on) m.sendProgramChange(a.channel, a.number); }\n\telse if (on) m.sendNoteOn(a.channel, a.number, a.value);\n\telse m.sendNoteOff(a.channel, a.number);\n}\n\n// Acciones extra de un control (\"además, enviar...\"): pressed = true al pulsar, false al soltar.\nfunction runExtras(note, d, pressed) {\n\tif (!d.extra) return;\n\tfor (var i = 0; i < d.extra.length && i < MAX_EXTRA; i++) {\n\t\tvar a = d.extra[i];\n\t\tvar k = note * MAX_EXTRA + i;\n\t\tif (a.mode == \"toggle\") {\n\t\t\tif (!pressed) continue;\n\t\t\textraToggle[k] = extraToggle[k] ? 0 : 1;\n\t\t\tsendOut(a, extraToggle[k]);\n\t\t}\n\t\telse if (a.mode == \"hold\") sendOut(a, pressed ? 1 : 0);\n\t\telse if (pressed) { sendOut(a, 1); sendOut(a, 0); }\n\t}\n}\n\n// ---------- mapa ----------\n\nfunction configPath() { return script.getScriptDirectory() + \"/\" + CONFIG_FILE; }\n\n// Devuelve true si el mapa ha cambiado.\nfunction loadConfig() {\n\tvar p = configPath();\n\tif (util.fileExists(p)) {\n\t\tvar text = util.readFile(p);\n\t\tif (cfg && text == cfgText) return false;\n\t\tcfgText = text;\n\t\tvar c = util.readFile(p, true);\n\t\tif (c && c.pads && c.pads.length == 64) {\n\t\t\tcfg = c;\n\t\t\tscript.log(\"Mapa cargado: \" + p + \" (\" + cfg.name + \")\");\n\t\t\treturn true;\n\t\t}\n\t\tscript.logWarning(\"No se pudo leer \" + p + \" (¿JSON roto?). Sigo con el mapa anterior.\");\n\t}\n\tif (!cfg && EMBEDDED_CONFIG) {\n\t\tcfg = EMBEDDED_CONFIG;\n\t\tscript.log(\"No hay \" + CONFIG_FILE + \": uso el mapa incluido en el script (\" + cfg.name + \")\");\n\t\treturn true;\n\t}\n\tif (!cfg) script.logError(\"No hay mapa: falta \" + p);\n\treturn false;\n}\n\nfunction opt(name, def) {\n\tif (cfg && cfg.options && cfg.options[name] != undefined) return cfg.options[name];\n\treturn def;\n}\n\n// Definición del control de una nota (pad, botón o shift).\nfunction defFor(note) {\n\tif (!cfg) return null;\n\tif (note >= 0 && note <= 63) return cfg.pads[note];\n\tif (note >= TRACK_FIRST && note < TRACK_FIRST + 8) return cfg.bottom[note - TRACK_FIRST];\n\tif (note >= SCENE_FIRST && note < SCENE_FIRST + 8) return cfg.side[note - SCENE_FIRST];\n\tif (note == SHIFT) return cfg.shift;\n\treturn null;\n}\n\n// LED de un control en reposo (\"idle\") o activado (\"active\").\n// Pads: canal = brillo/animación, velocity = color. Botones: canal 1, 0 apagado, 1 fijo, 2 parpadeo.\nfunction ctlLed(note, d, on) {\n\tif (note <= 63) {\n\t\tvar ch = on ? d.led.active : d.led.loaded;\n\t\tif (!ch) local.sendNoteOn(1, note, 0);\n\t\telse local.sendNoteOn(ch, note, d.color);\n\t\treturn;\n\t}\n\tif (note == SHIFT) return; // el shift no tiene LED\n\tlocal.sendNoteOn(1, note, on ? d.led.active : d.led.idle);\n}\n\n// ---------- acciones ----------\n\nfunction pulse(address) {\n\tresolume().send(address, 1);\n\tresolume().send(address, 0);\n}\n\nfunction connectClip(layer, clip) {\n\tresolume().send(\"/composition/layers/\" + layer + \"/clips/\" + clip + \"/connect\", 1);\n}\n\nfunction clearLayer(layer) {\n\tresolume().send(\"/composition/layers/\" + layer + \"/clear\", 1);\n}\n\nfunction press(note, d) {\n\tpressMain(note, d);\n\trunExtras(note, d, true);\n}\n\n// Acción principal de un control.\nfunction pressMain(note, d) {\n\tvar t = d.type;\n\tvar i;\n\tif (!t || t == \"none\") return false;\n\n\tif (t == \"clip\") { connectClip(d.layer, d.clip); return false; }\n\tif (t == \"dual\") { connectClip(d.layer, d.clip); connectClip(d.layer2, d.clip2); return false; }\n\tif (t == \"rgb\") { api().sendGET(\"composition/clips/selected?toggle=\" + d.rgb, \"json\"); return false; }\n\n\tif (t == \"bypass\") {\n\t\tvar on = bypassed[d.layers[0]] ? 0 : 1;\n\t\tfor (i = 0; i < d.layers.length; i++) {\n\t\t\tbypassed[d.layers[i]] = on;\n\t\t\tresolume().send(\"/composition/layers/\" + d.layers[i] + \"/bypassed\", on);\n\t\t}\n\t\tctlLed(note, d, on);\n\t\treturn false;\n\t}\n\tif (t == \"blackout\") {\n\t\tblackout = blackout ? 0 : 1;\n\t\tresolume().send(\"/composition/bypassed\", blackout);\n\t\tctlLed(note, d, blackout);\n\t\treturn false;\n\t}\n\tif (t == \"osc\" || t == \"midi\") {\n\t\tif (d.mode == \"toggle\") {\n\t\t\toscToggle[note] = oscToggle[note] ? 0 : 1;\n\t\t\tsendOut(d, oscToggle[note]);\n\t\t\tctlLed(note, d, oscToggle[note]);\n\t\t\treturn false;\n\t\t}\n\t\tsendOut(d, 1);\n\t\tif (d.mode != \"hold\") sendOut(d, 0);\n\t\tctlLed(note, d, 1);\n\t\treturn true;\n\t}\n\n\t// momentáneos\n\tif (t == \"tap\") pulse(\"/composition/tempocontroller/tempotap\");\n\telse if (t == \"resync\") pulse(\"/composition/tempocontroller/resync\");\n\telse if (t == \"clearAll\") pulse(\"/composition/disconnectall\");\n\telse if (t == \"clear\") { for (i = 0; i < d.layers.length; i++) clearLayer(d.layers[i]); }\n\telse if (t == \"prev\" || t == \"next\") api().sendGET(\"composition/layers/\" + d.layer + \"?step=\" + t, \"json\");\n\telse if (t == \"refresh\") refresh();\n\telse return false;\n\n\t// tap y resync en un pad: el LED no cambia al pulsar (el de tap parpadea a tempo)\n\tif (note <= 63 && (t == \"tap\" || t == \"resync\")) return false;\n\tctlLed(note, d, 1);\n\treturn true;\n}\n\nfunction release(note, d) {\n\tvar t = d.type;\n\tif ((t == \"osc\" || t == \"midi\") && d.mode == \"hold\") sendOut(d, 0);\n\tif (isMomentary(note, d)) ctlLed(note, d, 0);\n\trunExtras(note, d, false);\n}\n\nfunction isMomentary(note, d) {\n\tvar t = d.type;\n\tif (t == \"osc\" || t == \"midi\") return d.mode != \"toggle\";\n\tif (t == \"tap\" || t == \"resync\") return note > 63;\n\treturn t == \"clearAll\" || t == \"clear\" || t == \"prev\" || t == \"next\" || t == \"refresh\";\n}\n\n// ---------- callbacks de Chataigne ----------\n\nfunction init() {\n\tloadConfig();\n\tscript.setUpdateRate(20);\n\trefresh();\n}\n\nfunction update(deltaTime) {\n\t// velocidad de clip: como mucho 20 envíos por segundo aunque el fader mande más\n\tfor (var i = 0; i < 9; i++) {\n\t\tif (pendingSpeed[i] < 0) continue;\n\t\tsendSpeed(cfg.faders[i], pendingSpeed[i]);\n\t\tpendingSpeed[i] = -1;\n\t}\n\tif (!opt(\"autoReload\", true)) return;\n\treloadTime += deltaTime;\n\tif (reloadTime < 2) return;\n\treloadTime = 0;\n\tif (loadConfig()) refresh();\n}\n\nfunction scriptParameterChanged(param) {\n\tif (param.is(testLeds)) {\n\t\tfor (var p = 0; p < 64; p++) local.sendNoteOn(7, p, COLORS8[Math.floor(p / 8)]);\n\t\tfor (var b = 0; b < 8; b++) {\n\t\t\tlocal.sendNoteOn(1, TRACK_FIRST + b, 1);\n\t\t\tlocal.sendNoteOn(1, SCENE_FIRST + b, 1);\n\t\t}\n\t\tscript.log(\"Test LEDs enviado\");\n\t}\n\telse if (param.is(clearLeds)) refresh();\n\telse if (param.is(reloadMap)) {\n\t\tcfgText = \"\";\n\t\tloadConfig();\n\t\trefresh();\n\t}\n}\n\nfunction noteOnEvent(channel, pitch, velocity) {\n\tif (velocity == 0) { noteOffEvent(channel, pitch, velocity); return; }\n\tvar d = defFor(pitch);\n\tif (d) press(pitch, d);\n}\n\nfunction noteOffEvent(channel, pitch, velocity) {\n\tvar d = defFor(pitch);\n\tif (d) release(pitch, d);\n}\n\nfunction ccEvent(channel, number, value) {\n\tif (!cfg) return;\n\tvar i = number - FADER_FIRST;\n\tif (i < 0 || i > 8) return;\n\tvar f = cfg.faders[i];\n\tvar x = value / 127.0;\n\tvar t = f.type;\n\tif (t == \"layerOpacity\") resolume().send(\"/composition/layers/\" + f.layer + \"/video/opacity\", x);\n\telse if (t == \"layerMaster\") resolume().send(\"/composition/layers/\" + f.layer + \"/master\", x);\n\telse if (t == \"compMaster\") resolume().send(\"/composition/master\", x);\n\telse if (t == \"compOpacity\") resolume().send(\"/composition/video/opacity\", x);\n\telse if (t == \"osc\") {\n\t\tvar mn = f.min == undefined ? 0 : f.min;\n\t\tvar mx = f.max == undefined ? 1 : f.max;\n\t\tvar m = target(f.target);\n\t\tif (m) m.send(f.address, mn + (mx - mn) * x);\n\t}\n\telse if (t == \"midiCC\") {\n\t\tvar mc = target(f.target);\n\t\tif (mc) mc.sendCC(f.channel, f.number, Math.round(f.min + (f.max - f.min) * x));\n\t}\n\telse if (t == \"clipSpeed\") {\n\t\t// curva exponencial: con 0,25 y 4 queda 0,25x abajo, 1x en el centro y 4x arriba\n\t\tvar speed = f.min * Math.pow(f.max / f.min, x);\n\t\tif (Math.abs(speed - lastSpeed[i]) < 0.0001) return;\n\t\tlastSpeed[i] = speed;\n\t\tpendingSpeed[i] = speed;\n\t}\n}\n\n// Velocidad de un clip. Por OSC Resolume la ignora, así que va por la API web:\n//  \"put\"       = PUT del clip por su número de capa y clip (no necesita ids)\n//  \"websocket\" = como antes: resolume_api.js lee el id y lo manda por el módulo \"resolumews\"\nfunction sendSpeed(f, speed) {\n\tvar path = \"composition/layers/\" + f.layer + \"/clips/\" + f.clip;\n\tif (opt(\"debug\", false)) script.log(\"velocidad \" + path + \" -> \" + speed + \" (\" + opt(\"speedMethod\", \"put\") + \")\");\n\tif (opt(\"speedMethod\", \"put\") == \"websocket\") {\n\t\tapi().sendGET(path + \"?speed=\" + speed, \"json\");\n\t\treturn;\n\t}\n\tapi().sendPUT(path, {\n\t\tpayload: { transport: { controls: { speed: { value: speed } } } },\n\t\textraHeaders: \"Content-Type: application/json\",\n\t\tdataType: \"raw\"\n\t});\n}\n\n// Pinta los controles que no dependen de Resolume y pide a Resolume el estado de lo demás.\n// Los pads de clips los pinta resolume_to_apc.js y los R/G/B resolume_api.js: aquí no se\n// tocan para no pisarse.\nfunction refresh() {\n\tif (!cfg) return;\n\tvar p, d, t, k, n;\n\tvar askBlackout = false;\n\n\tfor (p = 0; p < 64; p++) {\n\t\td = cfg.pads[p];\n\t\tt = d.type;\n\t\tif (t == \"clip\" || t == \"dual\" || t == \"rgb\") continue;\n\t\tif (t == \"bypass\" || t == \"blackout\") ctlLed(p, d, 0);\n\t\telse if ((t == \"osc\" || t == \"midi\") && d.mode == \"toggle\") ctlLed(p, d, oscToggle[p]);\n\t\telse if (!t || t == \"none\") local.sendNoteOn(1, p, 0);\n\t\telse ctlLed(p, d, 0);\n\t}\n\tfor (k = 0; k < 16; k++) {\n\t\tn = k < 8 ? TRACK_FIRST + k : SCENE_FIRST + k - 8;\n\t\td = defFor(n);\n\t\tif ((d.type == \"osc\" || d.type == \"midi\") && d.mode == \"toggle\") ctlLed(n, d, oscToggle[n]);\n\t\telse if (!d.type || d.type == \"none\") local.sendNoteOn(1, n, 0);\n\t\telse ctlLed(n, d, 0);\n\t}\n\n\t// estado de blackout y bypass: lo devuelve Resolume y lo pinta resolume_to_apc.js\n\tfor (k = 0; k < 81; k++) {\n\t\tn = k < 64 ? k : (k < 72 ? TRACK_FIRST + k - 64 : (k < 80 ? SCENE_FIRST + k - 72 : SHIFT));\n\t\td = defFor(n);\n\t\tif (d.type == \"blackout\") askBlackout = true;\n\t\tif (d.type == \"bypass\")\n\t\t\tfor (var b = 0; b < d.layers.length; b++) resolume().send(\"/composition/layers/\" + d.layers[b] + \"/bypassed\", \"?\");\n\t}\n\tif (askBlackout) resolume().send(\"/composition/bypassed\", \"?\");\n\n\tfor (p = 0; p < 64; p++) {\n\t\td = cfg.pads[p];\n\t\tif (d.type == \"clip\" || d.type == \"dual\")\n\t\t\tresolume().send(\"/composition/layers/\" + d.layer + \"/clips/\" + d.clip + \"/connected\", \"?\");\n\t}\n}\n","resolume_to_apc.js":"// Resolume (OSC) -> LEDs del APC mini mk2\n// Script del módulo OSC \"resolume\". Escucha el estado de los clips y pinta los pads.\n//\n// El mapa se lee de apc_config.json (misma carpeta que el script), igual que apc_to_resolume.js.\n//\n// Estado \"connected\" que manda Resolume por clip:\n//   0 vacío  1 cargado  2 cargado+preview  3 conectado  4 conectado+preview\n// En el mapa: vacío = led.empty, cargado (1-2) = led.loaded, activo (3-4) = led.active.\n//\n// En el mk2 el canal MIDI es el brillo: 1=10% 2=25% 3=50% 4=65% 5=75% 6=90% 7=100%\n// 8-11 = pulso (1/16, 1/8, 1/4, 1/2), 12-16 = parpadeo (1/24, 1/16, 1/8, 1/4, 1/2). 0 = apagado.\n//\n// Generado por el configurador APC mini mk2 <-> Resolume.\n\nvar CONFIG_FILE = \"apc_config.json\";\nvar EMBEDDED_CONFIG = null; // @@CONFIG@@\n\nvar cfg = null;\nvar cfgText = \"\";\nvar reloadTime = 0;\n\nvar TRACK_FIRST = 100;\nvar SCENE_FIRST = 112;\nvar SHIFT = 122;\n\nvar state = [];\nfor (var i = 0; i < 64; i++) state.push(-1); // -1 = aún sin estado\nvar ticks = 0;\nvar lastBpm = 0;\n\nfunction apc() { return root.modules.apc; }\n\n// ---------- mapa ----------\n\nfunction configPath() { return script.getScriptDirectory() + \"/\" + CONFIG_FILE; }\n\nfunction loadConfig() {\n\tvar p = configPath();\n\tif (util.fileExists(p)) {\n\t\tvar text = util.readFile(p);\n\t\tif (cfg && text == cfgText) return false;\n\t\tcfgText = text;\n\t\tvar c = util.readFile(p, true);\n\t\tif (c && c.pads && c.pads.length == 64) {\n\t\t\tcfg = c;\n\t\t\tscript.log(\"Mapa cargado: \" + p + \" (\" + cfg.name + \")\");\n\t\t\treturn true;\n\t\t}\n\t\tscript.logWarning(\"No se pudo leer \" + p + \" (¿JSON roto?). Sigo con el mapa anterior.\");\n\t}\n\tif (!cfg && EMBEDDED_CONFIG) {\n\t\tcfg = EMBEDDED_CONFIG;\n\t\tscript.log(\"No hay \" + CONFIG_FILE + \": uso el mapa incluido en el script (\" + cfg.name + \")\");\n\t\treturn true;\n\t}\n\tif (!cfg) script.logError(\"No hay mapa: falta \" + p);\n\treturn false;\n}\n\nfunction opt(name, def) {\n\tif (cfg && cfg.options && cfg.options[name] != undefined) return cfg.options[name];\n\treturn def;\n}\n\nfunction defFor(note) {\n\tif (!cfg) return null;\n\tif (note >= 0 && note <= 63) return cfg.pads[note];\n\tif (note >= TRACK_FIRST && note < TRACK_FIRST + 8) return cfg.bottom[note - TRACK_FIRST];\n\tif (note >= SCENE_FIRST && note < SCENE_FIRST + 8) return cfg.side[note - SCENE_FIRST];\n\tif (note == SHIFT) return cfg.shift;\n\treturn null;\n}\n\n// Recorre todas las notas con control: 0-63, 100-107, 112-119, 122.\nfunction noteAt(k) {\n\tif (k < 64) return k;\n\tif (k < 72) return TRACK_FIRST + k - 64;\n\tif (k < 80) return SCENE_FIRST + k - 72;\n\treturn SHIFT;\n}\n\nfunction ctlLed(note, d, on) {\n\tif (note <= 63) {\n\t\tvar ch = on ? d.led.active : d.led.loaded;\n\t\tif (!ch) apc().sendNoteOn(1, note, 0);\n\t\telse apc().sendNoteOn(ch, note, d.color);\n\t\treturn;\n\t}\n\tif (note == SHIFT) return;\n\tapc().sendNoteOn(1, note, on ? d.led.active : d.led.idle);\n}\n\n// ---------- callbacks ----------\n\nfunction init() {\n\tloadConfig();\n\tpaintInitial();\n\tscript.setUpdateRate(opt(\"pollHz\", 1));\n}\n\n// Al arrancar, los pads de clip que tienen luz aunque estén vacíos (strobos, cegados)\n// se encienden ya, sin esperar a Resolume.\nfunction paintInitial() {\n\tif (!cfg) return;\n\tfor (var p = 0; p < 64; p++) {\n\t\tstate[p] = -1;\n\t\tvar d = cfg.pads[p];\n\t\tif ((d.type == \"clip\" || d.type == \"dual\") && d.led.empty) drawPad(p, 0);\n\t}\n}\n\nfunction update(deltaTime) {\n\tif (!cfg) { loadConfig(); return; }\n\n\tif (opt(\"autoReload\", true)) {\n\t\treloadTime += deltaTime;\n\t\tif (reloadTime >= 2) {\n\t\t\treloadTime = 0;\n\t\t\tif (loadConfig()) paintInitial();\n\t\t}\n\t}\n\n\t// Tempo: se pregunta a Resolume y se pasa al módulo MIDI del APC, que le manda reloj\n\t// MIDI; así los parpadeos y pulsos del APC van al BPM.\n\tif (opt(\"tempoSync\", true)) local.send(\"/composition/tempocontroller/tempo\", \"?\");\n\n\t// cada N sondeos se olvida el estado para repintar todos los pads con la siguiente respuesta\n\tticks++;\n\tif (ticks >= opt(\"repaintEvery\", 5)) {\n\t\tticks = 0;\n\t\tfor (var s = 0; s < 64; s++) state[s] = -1;\n\t}\n\n\t// se vuelve a pedir el estado de todos los clips del APC por si se pierde algún cambio\n\tfor (var p = 0; p < 64; p++) {\n\t\tvar d = cfg.pads[p];\n\t\tif (d.type == \"clip\" || d.type == \"dual\")\n\t\t\tlocal.send(\"/composition/layers/\" + d.layer + \"/clips/\" + d.clip + \"/connected\", \"?\");\n\t}\n}\n\nfunction setTempo(value) {\n\tvar bpm = value <= 1 ? 20 + value * 480 : value; // Resolume lo manda normalizado 20-500\n\tif (Math.abs(bpm - lastBpm) < 0.05) return;\n\tlastBpm = bpm;\n\tvar t = apc().values.tempo;\n\tt.bpm.set(bpm);\n\tif (!t.sendClock.get()) t.sendClock.set(true);\n}\n\nfunction oscEvent(address, args) {\n\tif (!cfg) return;\n\tvar k, n, d, b;\n\n\tif (address == \"/composition/tempocontroller/tempo\" && args.length > 0) {\n\t\tif (opt(\"tempoSync\", true)) setTempo(parseFloat(args[0]));\n\t\treturn;\n\t}\n\n\t// /composition/bypassed -> LED de los controles de blackout\n\tif (address == \"/composition/bypassed\" && args.length > 0) {\n\t\tvar bo = parseInt(args[0]) ? 1 : 0;\n\t\tfor (k = 0; k < 81; k++) {\n\t\t\tn = noteAt(k);\n\t\t\td = defFor(n);\n\t\t\tif (d.type == \"blackout\") ctlLed(n, d, bo);\n\t\t}\n\t\treturn;\n\t}\n\n\tvar parts = address.split(\"/\");\n\n\t// /composition/layers/L/bypassed -> LED de los controles de bypass de esa capa\n\tif (parts.length == 5 && parts[2] == \"layers\" && parts[4] == \"bypassed\" && args.length > 0) {\n\t\tvar bl = parseInt(parts[3]);\n\t\tvar on = parseInt(args[0]) ? 1 : 0;\n\t\tfor (k = 0; k < 81; k++) {\n\t\t\tn = noteAt(k);\n\t\t\td = defFor(n);\n\t\t\tif (d.type == \"bypass\" && d.layers[0] == bl) ctlLed(n, d, on);\n\t\t}\n\t\treturn;\n\t}\n\n\t// /composition/layers/L/clips/C/connected\n\t// (no /connect: ese es el disparo y vale 1 aunque el clip suene)\n\tif (parts.length != 7 || parts[2] != \"layers\" || parts[4] != \"clips\" || parts[6] != \"connected\") return;\n\tif (args.length < 1) return;\n\n\tvar layer = parseInt(parts[3]);\n\tvar clip = parseInt(parts[5]);\n\tvar v = parseInt(args[0]);\n\n\tfor (var p = 0; p < 64; p++) {\n\t\td = cfg.pads[p];\n\t\tif (d.type != \"clip\" && d.type != \"dual\") continue;\n\t\tif (d.layer != layer || d.clip != clip) continue;\n\t\tif (state[p] == v) continue; // sin cambios (llega cada segundo por el sondeo)\n\t\tstate[p] = v;\n\t\tdrawPad(p, v);\n\t}\n}\n\nfunction drawPad(pad, v) {\n\tvar d = cfg.pads[pad];\n\tvar ch = v <= 0 ? d.led.empty : (v <= 2 ? d.led.loaded : d.led.active);\n\tif (!ch) apc().sendNoteOn(1, pad, 0);\n\telse apc().sendNoteOn(ch, pad, d.color);\n}\n","resolume_api.js":"// Funciones que necesitan leer el estado de Resolume por su API web\n// Script del módulo HTTP \"resolumeapi\" (Base Address http://127.0.0.1:8080/api/v1/).\n//\n// El mapa se lee de apc_config.json (misma carpeta que el script), igual que apc_to_resolume.js.\n//\n// - Pads R/G/B del clip seleccionado (pads de tipo \"rgb\"): se consulta el clip seleccionado\n//   varias veces por segundo. Activo = led.active, canal quitado = led.loaded,\n//   clip vacío = led.empty. Al pulsar, apc_to_resolume.js pide el clip con \"?toggle=r\"\n//   (g, b) y aquí se manda por OSC el valor contrario.\n// - Clip anterior / siguiente: apc_to_resolume.js pide la capa con \"?step=prev\" o\n//   \"?step=next\" y aquí se busca el clip activo y se conecta el anterior o siguiente que\n//   tenga contenido.\n// - Velocidad de clip con speedMethod = \"websocket\": apc_to_resolume.js pide el clip con\n//   \"?speed=X\", aquí se lee el id del parámetro y se manda por el módulo \"resolumews\".\n//   Con speedMethod = \"put\" (por defecto) apc_to_resolume.js lo hace solo y aquí no llega nada.\n//\n// Generado por el configurador APC mini mk2 <-> Resolume.\n\nvar CONFIG_FILE = \"apc_config.json\";\nvar EMBEDDED_CONFIG = null; // @@CONFIG@@\n\nvar cfg = null;\nvar cfgText = \"\";\nvar reloadTime = 0;\n\nvar CH = [\"r\", \"g\", \"b\"];\n\nfunction apc() { return root.modules.apc; }\nfunction osc() { return root.modules.resolume; }\n\n// ---------- mapa ----------\n\nfunction configPath() { return script.getScriptDirectory() + \"/\" + CONFIG_FILE; }\n\nfunction loadConfig() {\n\tvar p = configPath();\n\tif (util.fileExists(p)) {\n\t\tvar text = util.readFile(p);\n\t\tif (cfg && text == cfgText) return false;\n\t\tcfgText = text;\n\t\tvar c = util.readFile(p, true);\n\t\tif (c && c.pads && c.pads.length == 64) {\n\t\t\tcfg = c;\n\t\t\tscript.log(\"Mapa cargado: \" + p + \" (\" + cfg.name + \")\");\n\t\t\treturn true;\n\t\t}\n\t\tscript.logWarning(\"No se pudo leer \" + p + \" (¿JSON roto?). Sigo con el mapa anterior.\");\n\t}\n\tif (!cfg && EMBEDDED_CONFIG) {\n\t\tcfg = EMBEDDED_CONFIG;\n\t\tscript.log(\"No hay \" + CONFIG_FILE + \": uso el mapa incluido en el script (\" + cfg.name + \")\");\n\t\treturn true;\n\t}\n\tif (!cfg) script.logError(\"No hay mapa: falta \" + p);\n\treturn false;\n}\n\nfunction opt(name, def) {\n\tif (cfg && cfg.options && cfg.options[name] != undefined) return cfg.options[name];\n\treturn def;\n}\n\nfunction hasRgbPads() {\n\tif (!cfg) return false;\n\tfor (var p = 0; p < 64; p++) if (cfg.pads[p].type == \"rgb\") return true;\n\treturn false;\n}\n\n// ---------- callbacks ----------\n\nfunction init() {\n\tloadConfig();\n\tscript.setUpdateRate(opt(\"rgbHz\", 5));\n}\n\nfunction update(deltaTime) {\n\tif (opt(\"autoReload\", true)) {\n\t\treloadTime += deltaTime;\n\t\tif (reloadTime >= 2) {\n\t\t\treloadTime = 0;\n\t\t\tloadConfig();\n\t\t}\n\t}\n\tif (hasRgbPads()) local.sendGET(\"composition/clips/selected\", \"json\");\n}\n\nfunction dataEvent(data, url) {\n\tif (!cfg) return;\n\tif (url.indexOf(\"speed=\") >= 0) setSpeed(data, url);\n\telse if (url.indexOf(\"step=\") >= 0) stepClip(data, url);\n\telse if (url.indexOf(\"clips/selected\") >= 0) rgb(data, url);\n\t// las respuestas a los PUT de velocidad llegan vacías: no hay nada que hacer\n}\n\nfunction rgb(data, url) {\n\tvar p, d;\n\t// sin clip cargado en la selección: brillo de \"vacío\" y no se cambia nada\n\tif (!data.video || (data.connected && data.connected.value == \"Empty\")) {\n\t\tfor (p = 0; p < 64; p++) {\n\t\t\td = cfg.pads[p];\n\t\t\tif (d.type != \"rgb\") continue;\n\t\t\tif (!d.led.empty) apc().sendNoteOn(1, p, 0);\n\t\t\telse apc().sendNoteOn(d.led.empty, p, d.color);\n\t\t}\n\t\treturn;\n\t}\n\tvar v = data.video;\n\tvar vals = [v.r.value, v.g.value, v.b.value];\n\n\tvar t = url.indexOf(\"toggle=\");\n\tif (t >= 0) {\n\t\tvar ch = url.substring(t + 7, t + 8);\n\t\tfor (var i = 0; i < 3; i++) {\n\t\t\tif (CH[i] != ch) continue;\n\t\t\tvals[i] = vals[i] ? false : true;\n\t\t\tosc().send(\"/composition/selectedclip/video/\" + ch + \"scale\", vals[i] ? 1 : 0);\n\t\t}\n\t}\n\n\tfor (p = 0; p < 64; p++) {\n\t\td = cfg.pads[p];\n\t\tif (d.type != \"rgb\") continue;\n\t\tfor (var j = 0; j < 3; j++) {\n\t\t\tif (CH[j] != d.rgb) continue;\n\t\t\tvar c = vals[j] ? d.led.active : d.led.loaded;\n\t\t\tif (!c) apc().sendNoteOn(1, p, 0);\n\t\t\telse apc().sendNoteOn(c, p, d.color);\n\t\t}\n\t}\n}\n\nfunction stepClip(data, url) {\n\tif (!data.clips) return;\n\tvar clips = data.clips;\n\tvar n = clips.length;\n\tvar dir = url.indexOf(\"step=prev\") >= 0 ? -1 : 1;\n\n\tvar current = -1;\n\tfor (var i = 0; i < n; i++)\n\t\tif (clips[i].connected.value.indexOf(\"Connected\") == 0) current = i;\n\n\tvar start = current < 0 ? (dir > 0 ? -1 : n) : current;\n\tfor (var k = 1; k <= n; k++) {\n\t\tvar idx = start + dir * k;\n\t\tif (idx < 0 || idx >= n) return; // no da la vuelta\n\t\tif (clips[idx].connected.value != \"Empty\") {\n\t\t\tvar layer = url.substring(url.indexOf(\"layers/\") + 7, url.indexOf(\"?\"));\n\t\t\tosc().send(\"/composition/layers/\" + layer + \"/clips/\" + (idx + 1) + \"/connect\", 1);\n\t\t\treturn;\n\t\t}\n\t}\n}\n\n// Velocidad de un clip por WebSocket (speedMethod = \"websocket\"): por OSC Resolume no deja\n// cambiarla, así que se manda por el módulo \"resolumews\" usando el id del parámetro, que se\n// lee del clip pedido. Los ids cambian cada vez que se abre Resolume: por eso se leen siempre.\nfunction setSpeed(data, url) {\n\tvar ws = root.modules.resolumews;\n\tif (!ws) {\n\t\tscript.logError(\"velocidad: no existe el módulo WebSocket \\\"resolumews\\\". Créalo en Chataigne (WebSocket Client, Server Path 127.0.0.1:8080/api/v1) o usa speedMethod = put\");\n\t\treturn;\n\t}\n\tif (!data.transport || !data.transport.controls || !data.transport.controls.speed) {\n\t\tscript.logWarning(\"velocidad: el clip no tiene transport/speed (\" + url + \")\");\n\t\treturn;\n\t}\n\tvar id = data.transport.controls.speed.id;\n\tvar value = parseFloat(url.substring(url.indexOf(\"speed=\") + 6));\n\tvar msg = '{\"action\":\"set\",\"parameter\":\"/parameter/by-id/' + id + '\",\"value\":' + value + '}';\n\tif (opt(\"debug\", false)) script.log(\"velocidad: envío \" + msg);\n\tws.send(msg);\n}\n"},"noisette":{"metaData":{"version":"1.10.4","versionNumber":68100},"projectSettings":{"containers":{"dashboardSettings":{"parameters":[{"value":"","controlAddress":"/showDashboardOnStartup","enabled":false}]},"customDefinitions":{}}},"dashboardManager":{"viewOffset":[0,0],"viewZoom":1},"parrots":{"viewOffset":[0,0],"viewZoom":1},"layout":{"mainLayout":{"type":1,"width":2046,"height":1302,"direction":2,"shifters":[{"type":1,"width":2046,"height":1302,"direction":2,"shifters":[{"type":1,"width":2046,"height":727,"direction":1,"shifters":[{"type":1,"width":307,"height":727,"direction":2,"shifters":[{"type":0,"width":307,"height":370,"currentContent":"Modules","tabs":[{"name":"Modules"}]},{"type":0,"width":307,"height":350,"currentContent":"Custom Variables","tabs":[{"name":"Custom Variables"}]}]},{"type":0,"width":1299,"height":727,"currentContent":"State Machine","tabs":[{"name":"State Machine"},{"name":"Dashboard"},{"name":"Module Router"},{"name":"Morpher"}]},{"type":0,"width":428,"height":727,"currentContent":"Inspector","tabs":[{"name":"Inspector"}]}]},{"type":1,"width":2046,"height":568,"direction":1,"shifters":[{"type":0,"width":178,"height":568,"currentContent":"Sequences","tabs":[{"name":"Sequences"}]},{"type":0,"width":1382,"height":568,"currentContent":"Sequence Editor","tabs":[{"name":"Sequence Editor"}]},{"type":0,"width":474,"height":568,"currentContent":"Logger","tabs":[{"name":"Help"},{"name":"Logger"},{"name":"Warnings"}]}]}]}]},"windows":null},"modules":{"items":[{"parameters":[{"value":true,"controlAddress":"/enabled"}],"niceName":"apc","type":"MIDI","scripts":{"items":[{"parameters":[{"value":"D:/VISUALES/Jungle Tribal/chataigne/apc_to_resolume.js","controlAddress":"/filePath"}],"niceName":"apc_to_resolume","type":"BaseItem","scriptParams":{}}],"viewOffset":[0,0],"viewZoom":1},"params":{"parameters":[{"value":false,"controlAddress":"/autoAdd"},{"value":false,"controlAddress":"/useHierarchy"},{"value":false,"controlAddress":"/usePitchForNoteNames"},{"value":["\\\\?\\usb#vid_09e8&pid_004f&mi_00#6&7dcb32a&0&0000#{6994ad04-93ef-11d0-a3cc-00a0c9223196}\\global","\\\\?\\usb#vid_09e8&pid_004f&mi_00#6&7dcb32a&0&0000#{6994ad04-93ef-11d0-a3cc-00a0c9223196}\\global"],"inputName":"APC mini mk2","outputName":"APC mini mk2","controlAddress":"/devices"}],"containers":{"pass_through":{}}},"templates":{"viewOffset":[0,0],"viewZoom":1},"values":{"containers":{"infos":{"parameters":[{"value":false,"controlAddress":"/oneNoteOn"},{"value":41,"hexMode":false,"controlAddress":"/lastPitch"},{"value":127,"hexMode":false,"controlAddress":"/lastVelocity"}]},"tempo":{"parameters":[{"value":133.7914085388184,"controlAddress":"/bpm"},{"value":true,"controlAddress":"/sendClock"}]},"mtc":{}}}},{"parameters":[{"value":true,"controlAddress":"/logIncoming"}],"niceName":"resolume","type":"OSC","scripts":{"items":[{"parameters":[{"value":"D:/VISUALES/Jungle Tribal/chataigne/resolume_to <script>// Configurador APC mini mk2 <-> Resolume (vía Chataigne). Interfaz del navegador.
// Todo el estado está en `cfg` (el mapa); cada cambio pasa por commit() para poder deshacer.
(function () {
	"use strict";

	const G = window.APCGen;
	const DATA = window.APP_DATA;

	// ---------- constantes del APC mini mk2 ----------

	// Paleta de 128 colores del APC mini mk2 (velocity -> color). Los LEDs reales se ven algo distintos.
	const PALETTE = [
		"#000000", "#1E1E1E", "#7F7F7F", "#FFFFFF", "#FF4C4C", "#FF0000", "#590000", "#190000",
		"#FFBD6C", "#FF5400", "#591D00", "#271B00", "#FFFF4C", "#FFFF00", "#595900", "#191900",

	function undo() {

		future.push(JSON.stringify(cfg));
		cfg = JSON.parse(history.pop());

	}

	// ---------- utilidades del mapa ----------

	function layerName(n) {
		const l = comp && comp.layers[n - 1];
		return (l && l.name) || cfg.layers[String(n)] || "";
	}
	function layerLabel(n) { const nm = layerName(n); return "Capa " + n + (nm ? " · " + nm : ""); }
	function clipName(layer, clip) {
		const i = comp && G.clipInfo(comp, layer, clip);
		return i && !i.missing ? i.name : "";
	}
	function ctlAt(kind, i) {
		if (kind == "pad") return cfg.pads[i];
		if (kind == "bottom") return cfg.bottom[i];
		if (kind == "side") return cfg.side[i];
		if (kind == "shift") return cfg.shift;
		return cfg.faders[i];
	}
	function selected() { return sel.idx.map((i) => ctlAt(sel.kind, i)); }
	function isToggle(d) { return d.type == "bypass" || d.type == "blackout" || ((d.type == "osc" || d.type == "midi") && d.mode == "toggle"); }
	function autoLabel(d) {
		if (d.label) return d.label;
		if (d.type == "clip") return clipName(d.layer, d.clip) || (layerName(d.layer) || "Capa " + d.layer) + " " + d.clip;
		if (d.type == "dual") return clipName(d.layer, d.clip) || "L" + d.layer + "+L" + d.layer2;
		if (d.type == "rgb") return d.rgb.toUpperCase();
		return "";
	}
	function noteOf(kind, i) {
		if (kind == "pad") return i;
		if (kind == "bottom") return 100 + i;
		if (kind == "side") return 112 + i;
		if (kind == "shift") return 122;
		return "CC " + (48 + i);
	}
	function ctlTitle(kind, i) {
		if (kind == "pad") return "Pad fila " + (Math.floor(i / 8) + 1) + " · columna " + ((i % 8) + 1);
		if (kind == "bottom") return "Botón de abajo " + (i + 1);
		if (kind == "side") return "Botón lateral " + (i + 1) + (i == 0 ? " (arriba)" : "");
		if (kind == "shift") return "Shift";
		return "Fader " + (i + 1) + (i == 8 ? " (master)" : "");
	}

	function padStates(d) {
		const t = d.type;
		if (t == "clip" || t == "dual") return [["empty", "Vacío"], ["loaded", "Cargado"], ["active", "Sonando"]];
		if (t == "rgb") return [["empty", "Sin clip seleccionado"], ["loaded", "Canal quitado"], ["active", "Canal activo"]];
		if (t == "tap") return [["loaded", "Siempre (va a tempo)"]];
		if (t == "none") return [];
		if (isToggle(d)) return [["loaded", "Desactivado"], ["active", "Activado"]];
		return [["loaded", "En reposo"], ["active", "Al pulsar"]];
	}
	function buttonStates(d) {

	// Valores por defecto al cambiar la función de un control
	function padDefaults(t) {
		const led = {
			clip: [0, 7, 15], dual: [0, 7, 15], rgb: [1, 14, 7], tap: [0, 15, 15], resync: [0, 7, 7],
			osc: [0, 3, 7], midi: [0, 3, 7], bypass: [0, 3, 15], blackout: [0, 3, 15], none: [0, 0, 0]
		}[t] || [0, 3, 7];
		return { empty: led[0], loaded: led[1], active: led[2] };
	}
	function setType(d, t, isPad) {
		const old = d.type;
		if (old == t) return;
		d.type = t;
		const firstMidi = cfg.targets.filter((x) => x.type == "midi")[0];
		if (t == "clip" || t == "dual") { d.layer = d.layer || 1; d.clip = d.clip || 1; d.name = ""; }
		if (t == "dual") { d.layer2 = d.layer2 || 2; d.clip2 = d.clip2 || 1; d.name2 = ""; }
		if (t == "osc") { d.target = "resolume"; d.address = d.address || "/composition/"; d.value = 1; d.mode = "pulse"; }
		if (t == "midi") { d.target = firstMidi ? firstMidi.id : ""; d.msg = "note"; d.channel = 1; d.number = 36; d.value = 127; d.mode = "pulse"; }
		if (t == "bypass" || t == "clear") d.layers = d.layers || [1];
		if (isPad) {
			if (!(old == "clip" && t == "dual") && !(old == "dual" && t == "clip")) d.led = padDefaults(t);
			if (!d.color && t != "none") d.color = 3;
		} else {
			d.led = { idle: 0, active: t == "none" ? 0 : (t == "bypass" || t == "blackout" ? 2 : 1) };
		}
	}

	// ---------- vista previa de LEDs ----------

	function beat() { return 60 / Math.max(20, bpm || 120); }
	function ledHtml(ch, hex) {
		if (!ch) return "";
		let style = "background:" + hex + ";";
		let cls = "led";
		let dur = 0;
		if (ch <= 7) style += "opacity:" + LEVELS[ch] + ";box-shadow:0 0 " + Math.round(LEVELS[ch] * 12) + "px " + hex + ";";
		else if (PULSE_FRAC[ch]) { cls += " pulse"; dur = beat() * 4 * PULSE_FRAC[ch]; }
		else { cls += " blink"; dur = beat() * 4 * BLINK_FRAC[ch]; }
		if (dur) style += "animation-duration:" + dur.toFixed(3) + "s;animation-delay:-" + ((performance.now() / 1000) % dur).toFixed(3) + "s;";
		return '<div class="' + cls + '" style="' + style + '"></div>';
	}
	function buttonLedHtml(v, hex) {
		if (!v) return "";
		if (v == 1) return ledHtml(7, hex);
		const dur = beat();
		return '<div class="led blink" style="background:' + hex + ";animation-duration:" + dur.toFixed(3) + "s;animation-delay:-" + ((performance.now() / 1000) % dur).toFixed(3) + 's"></div>';
	}
	function previewPadState(i) {
		const d = cfg.pads[i];
		const t = d.type;
		if (t == "none") return null;
		if (t == "clip" || t == "dual") {
			if (previewMode == "empty" || previewMode == "loaded" || previewMode == "active") return previewMode;
			const info = comp && G.clipInfo(comp, d.layer, d.clip);
			if (info && (info.missing || info.empty)) return "empty";
			if (previewMode == "show") return showState[i] || "loaded";
			const row = Math.floor(i / 8), col = i % 8;
			return col == row % 8 ? "active" : "loaded";
		}
		if (t == "rgb") return previewMode == "empty" ? "empty" : (previewMode == "loaded" ? "loaded" : "active");
		return previewMode == "active" ? "active" : "loaded";
	}
	function padLed(i) {
		const d = cfg.pads[i];
		const st = previewPadState(i);
		if (!st) return "";
		return ledHtml(d.led[st], PALETTE[d.color]);
	}

	// Simulación de show: cada dos tiempos suena un clip distinto en cada capa
	let showTimer = null;
	function updateShowTimer() {
		if (showTimer) { clearInterval(showTimer); showTimer = null; }
		if (previewMode != "show") return;
		const tick = () => {
			const byLayer = {};
			cfg.pads.forEach((d, i) => {
				if (d.type != "clip" && d.type != "dual") return;
				(byLayer[d.layer] = byLayer[d.layer] || []).push(i);
			});
			showState = {};
			Object.keys(byLayer).forEach((l) => {
				const pads = byLayer[l];
				pads.forEach((p) => { showState[p] = "loaded"; });
				if (Math.random() < 0.8) showState[pads[Math.floor(Math.random() * pads.length)]] = "active";
			});
			renderDevice();
		};
		tick();
		showTimer = setInterval(tick, beat() * 2000);
	}

			if (w.level == "error" || !m[w.ref.pad]) m[w.ref.pad] = w.level;
		});

	function faderLabel(f) {
		if (f.label) return f.label;
		if (f.type == "layerOpacity" || f.type == "layerMaster") return (layerName(f.layer) || "Capa " + f.layer) + (f.type == "layerMaster" ? " master" : "");
		if (f.type == "compMaster") return "Master";
