			self.connected = false;
		};
		self.param = (id) => params[id];
		self.on = function (id, fn) {
			(listeners[id] = listeners[id] || []).push(fn);
			if (!subscribed[id]) { subscribed[id] = true; send({ action: "subscribe", parameter: "/parameter/by-id/" + id }); }
			return () => { const l = listeners[id]; if (l) l.splice(l.indexOf(fn), 1); };
		};
		self.clearListeners = function () { Object.keys(listeners).forEach((k) => { listeners[k] = []; }); };
		self.set = (id, value) => send({ action: "set", parameter: "/parameter/by-id/" + id, value: value });
		self.reset = (id) => send({ action: "reset", parameter: "/parameter/by-id/" + id });
		self.trigger = (path, value) => send({ action: "trigger", parameter: path, value: value });
		self.thumbUrl = function (clip) {
			if (opts.sim || !clip || !clip.id) return "";
			const t = clip.thumbnail || {};
			if (t.is_default || !t.last_update) return "";
			return "http://" + self.host + "/api/v1/composition/clips/by-id/" + clip.id + "/thumbnail/" + t.last_update;
		};
	};

	// Chataigne por su servidor OSCQuery. host = "ip:puerto" (42000 por defecto).
	R.ChataigneConnection = function (opts) {
		const self = this;
		let ws = null, simLink = null, retry = 1000, timer = null, closed = false, refetch = null;
		self.tree = null;
		self.connected = false;
		self.host = opts.host;
		const params = {}, listeners = {}, listening = {};

		function setTree(tree) {
			self.tree = tree;
			(function index(n) {
				if (!n || typeof n != "object") return;
				if (n.CONTENTS) { Object.keys(n.CONTENTS).forEach((k) => index(n.CONTENTS[k])); return; }
				const p = CS.param(n);
				if (p) params[p.id] = Object.assign(params[p.id] || {}, p);
			})(tree);
			if (opts.onTree) opts.onTree(tree);
		}
		function fetchTree() {
			if (opts.sim) { setTree(opts.sim.tree()); return Promise.resolve(); }
			return fetch("http://" + self.host + "/", { cache: "no-store" }).then((r) => r.json()).then(setTree).catch(() => {});
		}
		function update(addr, args) {
			const id = CS.PREFIX + addr, p = params[id];
			if (!p) return;
			const v = CS.valueFromArgs(p, args);
			if (v === undefined) return;
			if (p.valuetype == "ParamChoice") { p.value = v; p.index = Math.max(0, (p.options || []).indexOf(v)); }
			else p.value = v;
			(listeners[id] || []).forEach((fn) => fn(p));
		}
		function onMessage(data) {
			if (typeof data == "string") {
				try {
					const m = JSON.parse(data);
					if (/^PATH_/.test(m.COMMAND)) { clearTimeout(refetch); refetch = setTimeout(fetchTree, 500); }
				} catch (e) { /* nada */ }
				return;
			}
			const m = data.address ? data : CS.decodeOSC(data);
			if (m) update(m.address, m.args);
		}
		function send(obj) {
			if (simLink) { simLink.receive(JSON.parse(JSON.stringify(obj))); return; }
			if (ws && ws.readyState == 1) ws.send(JSON.stringify(obj));
		}
		function listen(id) { send({ COMMAND: "LISTEN", DATA: [CS.address(id), true] }); }

		self.connect = function () {
			closed = false;
			if (opts.sim) {
				simLink = opts.sim.connect((m) => setTimeout(() => onMessage(JSON.parse(JSON.stringify(m))), 0));
				self.connected = true;
				fetchTree();
				Object.keys(listening).forEach(listen);
				if (opts.onStatus) opts.onStatus(true);
				return;
			}
			try { ws = new WebSocket("ws://" + self.host + "/"); } catch (e) { schedule(); return; }
			ws.binaryType = "arraybuffer";
			ws.onopen = () => {
				self.connected = true;
				retry = 1000;
				fetchTree().then(() => Object.keys(listening).forEach(listen));
				if (opts.onStatus) opts.onStatus(true);
			};
			ws.onmessage = (e) => onMessage(e.data);
			ws.onclose = ws.onerror = () => {
				if (ws) ws.onclose = ws.onerror = null;
				const was = self.connected;
				self.connected = false;
				if (was || !timer) { if (opts.onStatus) opts.onStatus(false); }
				schedule();
			};
		};
		function schedule() {
			if (closed || timer) return;
			timer = setTimeout(() => { timer = null; self.connect(); }, retry);
			retry = Math.min(retry * 2, 8000);
		}
		self.close = function () {
			closed = true;
			clearTimeout(timer); timer = null;
			if (ws) { ws.onclose = ws.onerror = null; try { ws.close(); } catch (e) { /* ya cerrado */ } ws = null; }
			if (simLink) { simLink.close(); simLink = null; }
			self.connected = false;
		};
		self.param = (id) => params[id];
		self.on = function (id, fn) {
			(listeners[id] = listeners[id] || []).push(fn);
			if (!listening[id]) { listening[id] = true; listen(id); }
			return () => { const l = listeners[id]; if (l) l.splice(l.indexOf(fn), 1); };
		};
		self.clearListeners = function () { Object.keys(listeners).forEach((k) => { listeners[k] = []; }); };
		self.set = function (id, v) {
			const p = params[id];
			if (!p) return;
			if (p.valuetype == "ParamEvent" && !v) return; // los pulsadores de Chataigne solo cuentan al pulsar
			const out = {};
			out[CS.address(id)] = CS.outgoing(p, v);
			send(out);
		};
	};

	// Une una conexión con Resolume y otra con Chataigne (cualquiera de las dos puede faltar).
	// Los ids de Resolume son números y los de Chataigne "chataigne:/ruta".
	R.MultiConnection = function (res, cha) {
		const pick = (id) => (CS && CS.isPath(String(id)) ? cha : res);
		const both = [res, cha].filter(Boolean);
		return {
			resolume: res, chataigne: cha,
			get composition() { return res ? res.composition : null; },
			get tree() { return cha ? cha.tree : null; },
			get host() { return res ? res.host : cha && cha.host; },
			connect: () => both.forEach((c) => c.connect()),
			close: () => both.forEach((c) => c.close()),
			clearListeners: () => both.forEach((c) => c.clearListeners()),
			param: (id) => { const c = pick(id); return c ? c.param(id) : null; },
			on: (id, fn) => { const c = pick(id); return c ? c.on(id, fn) : () => {}; },
			set: (id, v) => { const c = pick(id); if (c) c.set(id, v); },
			reset: (id) => { const c = pick(id); if (c && c.reset) c.reset(id); },
			trigger: (path, v) => { if (res) res.trigger(path, v); },
			thumbUrl: (clip) => (res ? res.thumbUrl(clip) : "")
		};
	};

	// Resuelve una ruta de Resolume o de Chataigne
	R.resolve = function (comp, tree, path) {
		if (CS && CS.isPath(path)) return CS.resolve(tree, path);
		return C.resolve(comp, path);
	};

	// Lee la composición una vez por WebSocket (funciona también desde un archivo local, sin CORS).
	R.fetchComposition = function (host, timeoutMs) {
		return new Promise((resolve, reject) => {
			let ws, done = false;
			const t = setTimeout(() => finish(new Error("Resolume no contesta en " + host)), timeoutMs || 5000);
			function finish(err, comp) {
				if (done) return;
				done = true;
				clearTimeout(t);
				try { ws.close(); } catch (e) { /* nada */ }
				if (err) reject(err); else resolve(comp);
			}
			try { ws = new WebSocket("ws://" + host + "/api/v1"); } catch (e) { finish(e); return; }
			ws.onmessage = (e) => {
				try { const m = JSON.parse(e.data); if (m && m.layers && m.columns) finish(null, m); } catch (err) { /* sigue esperando */ }
			};
			ws.onerror = () => finish(new Error("No se pudo conectar con ws://" + host + "/api/v1"));
		});
	};

	// ---------- controles ----------

	R.TYPES = {
		button: { name: "Botón", w: 2, h: 2, accepts: ["Action", "ParamEvent", "ParamBoolean", "ParamRange", "ParamInteger", "ParamNumber", "ParamChoice"] },
		fader: { name: "Fader", w: 1, h: 4, accepts: ["ParamRange", "ParamInteger"] },
		knob: { name: "Knob", w: 2, h: 2, accepts: ["ParamRange", "ParamInteger"] },
		xy: { name: "Pad XY", w: 4, h: 4, accepts: ["ParamRange"] },
		choice: { name: "Selector", w: 4, h: 1, accepts: ["ParamChoice"] },
		clipgrid: { name: "Rejilla de clips", w: 8, h: 2, accepts: [] },
		columns: { name: "Columnas", w: 8, h: 1, accepts: [] },
		layer: { name: "Tira de capa", w: 2, h: 6, accepts: [] },
		tempo: { name: "Tempo", w: 4, h: 2, accepts: [] },
		value: { name: "Valor", w: 2, h: 1, accepts: ["ParamRange", "ParamInteger", "ParamNumber", "ParamChoice", "ParamString", "ParamText", "ParamBoolean", "ParamColor"] },
		meter: { name: "Medidor", w: 3, h: 1, accepts: ["ParamRange", "ParamInteger"] },
		lamp: { name: "Indicador", w: 2, h: 1, accepts: ["ParamBoolean", "ParamRange", "ParamInteger", "ParamNumber", "ParamChoice"] },
		label: { name: "Texto", w: 4, h: 1, accepts: [] }
	};

	// Control adecuado para un tipo de parámetro (al arrastrar un parámetro al lienzo)
	R.typeFor = function (entry) {
		if (!entry) return "button";
		if (entry.valuetype == "ParamRange" || entry.valuetype == "ParamInteger") return entry.readonly ? "meter" : "fader";
		if (entry.valuetype == "ParamChoice") return entry.key == "connected" ? "value" : "choice";
		if (entry.valuetype == "ParamString" || entry.valuetype == "ParamText" || entry.valuetype == "ParamNumber" || entry.valuetype == "ParamColor") return "value";
		if (entry.readonly && entry.valuetype == "ParamBoolean") return "lamp";
		return "button";
	};

	function el(tag, cls, html) {
		const e = document.createElement(tag);
		if (cls) e.className = cls;
		if (html != null) e.innerHTML = html;
		return e;
	}
	function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
	function fmt(p) {
		if (!p) return "—";
		if (p.valuetype == "ParamChoice") return p.value;
		if (p.valuetype == "ParamBoolean") return p.value ? "On" : "Off";
		if (p.valuetype == "ParamColor") return String(p.value || "");
		if (typeof p.value == "number") {
			const units = p.view && p.view.display_units;
			const small = p.max != null && Math.abs(p.max - p.min) <= 2;
			const v = Number.isInteger(p.value) ? String(p.value) : small ? p.value.toFixed(2) : (Math.abs(p.value) >= 100 ? p.value.toFixed(1) : p.value.toFixed(2));
			return v + (units ? " " + units : "");
		}
		return String(p.value == null ? "" : p.value);
	}
	function norm(p) {
		if (!p || typeof p.value != "number" || p.max == p.min) return 0;
		return Math.max(0, Math.min(1, (p.value - p.min) / (p.max - p.min)));
	}
	function fromNorm(p, x) {
		x = Math.max(0, Math.min(1, x));
		let v = p.min + (p.max - p.min) * x;
		if (p.valuetype == "ParamInteger") v = Math.round(v);
		return v;
	}

	// Enlace de un control con un parámetro o una acción. ctx lo da la página.
	function bind(ctx, path) {
		const r = path ? ctx.resolve(path) : null;
		return {
			path: path, ok: !!r, kind: r && r.kind,
			param: r && r.kind == "param" ? ctx.param(r.param.id) || r.param : null,
			id: r && r.kind == "param" ? r.param.id : null,
			trigger: r && r.kind == "action" ? r.trigger : null,
			target: r && r.kind == "action" ? r.target : null
		};
	}

	// Pulsar con el dedo: down al tocar, up al soltar (aunque el dedo salga del control)
	function press(node, down, up) {
		node.addEventListener("pointerdown", (e) => {
			if (e.button > 0) return;
			e.preventDefault();
			try { node.setPointerCapture(e.pointerId); } catch (err) { /* nada */ }
			node.classList.add("down");
			down(e);
		});
		const end = (e) => {
			if (!node.classList.contains("down")) return;
			node.classList.remove("down");
			if (up) up(e);
		};
		node.addEventListener("pointerup", end);
		node.addEventListener("pointercancel", end);
	}

	// Arrastre continuo (faders, knobs, XY): fn(e, rect, start)
	function drag(node, fn, end) {
		let active = false, start = null;
		node.addEventListener("pointerdown", (e) => {
			if (e.button > 0) return;
			e.preventDefault();
			active = true;
			start = { x: e.clientX, y: e.clientY };
			try { node.setPointerCapture(e.pointerId); } catch (err) { /* nada */ }
			node.classList.add("down");
			fn(e, node.getBoundingClientRect(), start, true);
		});
		node.addEventListener("pointermove", (e) => { if (active) fn(e, node.getBoundingClientRect(), start, false); });
		const stop = () => { if (!active) return; active = false; node.classList.remove("down"); if (end) end(); };
		node.addEventListener("pointerup", stop);
		node.addEventListener("pointercancel", stop);
	}

	// Envío limitado a uno por fotograma
	function throttled(fn) {
		let pending = null, scheduled = false;
		return (v) => {
			pending = v;
			if (scheduled) return;
			scheduled = true;
			requestAnimationFrame(() => { scheduled = false; fn(pending); });
		};
	}
	// Doble toque
	function doubleTap(node, fn) {
		let last = 0;
		node.addEventListener("pointerdown", () => {
			const now = Date.now();
			if (now - last < 300) fn();
			last = now;
		});
	}

	const W = {};
	// control dentro de otro (rejilla, tempo, tira de capa)
	function part(inst) {
		inst.node.classList.add("rw");
		if (inst.missing) inst.node.classList.add("missing");
		return inst;
	}

	W.label = function (w) {
		const node = el("div", "rw-label", esc(w.label || "Texto"));
		node.style.fontSize = (w.opts && w.opts.size) || "";
		node.style.textAlign = (w.opts && w.opts.align) || "";
		return { node: node, update() {} };
	};

	W.value = function (w, ctx) {
		const b = bind(ctx, w.bind);
		const node = el("div", "rw-value", '<span class="rw-name"></span><span class="rw-big"></span>');
		node.querySelector(".rw-name").textContent = w.label || ctx.labelOf(w.bind);
		const big = node.querySelector(".rw-big");
		const update = () => { big.textContent = b.id != null ? fmt(ctx.param(b.id)) : "—"; };
		if (b.id != null) ctx.watch(b.id, update);
		return { node: node, update: update, missing: !b.ok && !!w.bind };
	};

	// Barra de nivel (solo muestra)
	W.meter = function (w, ctx) {
		const b = bind(ctx, w.bind);
		const vert = (w.opts || {}).orientation == "v";
		const node = el("div", "rw-meter" + (vert ? " v" : ""), '<span class="rw-name"></span><div class="rw-bar"><div class="rw-level"></div></div><span class="rw-num"></span>');
		node.querySelector(".rw-name").textContent = w.label || ctx.labelOf(w.bind) || "Medidor";
		const lvl = node.querySelector(".rw-level"), num = node.querySelector(".rw-num");
		const update = () => {
			const p = b.id != null ? ctx.param(b.id) : null;
			const x = p ? norm(p) : 0.5;
			if (vert) lvl.style.height = x * 100 + "%"; else lvl.style.width = x * 100 + "%";
			num.textContent = p ? fmt(p) : "";
		};
		if (b.id != null) ctx.watch(b.id, update);
		return { node: node, update: update, missing: !b.ok && !!w.bind };
	};

	// Luz que se enciende con un sí/no, con un valor por encima de un umbral o con una opción concreta
	W.lamp = function (w, ctx) {
		const o = w.opts || {};
		const b = bind(ctx, w.bind);
		const node = el("div", "rw-lamp", '<i></i><span class="rw-name"></span>');
		node.querySelector(".rw-name").textContent = w.label || ctx.labelOf(w.bind) || "Indicador";
		const update = () => {
			const p = b.id != null ? ctx.param(b.id) : null;
			let on = false;
			if (p) {
				if (p.valuetype == "ParamBoolean") on = !!p.value;
				else if (p.valuetype == "ParamChoice") on = p.index == (o.index || 0);
				else on = Number(p.value) > (o.threshold != null ? Number(o.threshold) : (p.max != null ? (p.min + p.max) / 2 : 0));
			}
			node.classList.toggle("on", on);
		};
		if (b.id != null) ctx.watch(b.id, update);
		return { node: node, update: update, missing: !b.ok && !!w.bind };
	};

	W.button = function (w, ctx) {
		const o = w.opts || {};
		const b = bind(ctx, w.bind);
		const node = el("div", "rw-button", '<div class="rw-thumb"></div><span class="rw-name"></span>');
		const nameEl = node.querySelector(".rw-name");
		const thumb = node.querySelector(".rw-thumb");
		nameEl.textContent = w.label || ctx.labelOf(w.bind) || "Botón";
		let lit = () => false;
		let fbId = null;

		if (b.kind == "action") {
			const t = b.target;
			if (/\/connect$/.test(b.trigger) && t && t.connected) {
				fbId = t.connected.id;
				lit = () => { const p = ctx.param(fbId); return p && (p.index >= 3 || p.value == "Connected"); };
				if (/\/clips\//.test(b.trigger) && o.thumb !== false) {
					const url = ctx.thumbUrl(t);
					if (url) thumb.style.backgroundImage = "url('" + url + "')";
					if (!w.label && t.name) nameEl.textContent = (t.name.value || "") || nameEl.textContent;
					const cp = ctx.param(fbId);
					if (cp && cp.index === 0) node.classList.add("empty");
				}
			} else if (/\/select$/.test(b.trigger) && t && t.selected) {
				fbId = t.selected.id;
				lit = () => { const p = ctx.param(fbId); return p && p.value === true; };
			}
			press(node, () => ctx.trigger(b.trigger, true), () => ctx.trigger(b.trigger, false));
		} else if (b.param) {
			const vt = b.param.valuetype;
			fbId = b.id;
			if (vt == "ParamEvent") press(node, () => ctx.set(b.id, true), () => ctx.set(b.id, false));
			else if (vt == "ParamBoolean") {
				lit = () => { const p = ctx.param(b.id); return p && p.value === true; };
				if (o.mode == "momentary") press(node, () => ctx.set(b.id, true), () => ctx.set(b.id, false));
				else press(node, () => { const p = ctx.param(b.id); ctx.set(b.id, !(p && p.value)); });
			} else if (vt == "ParamChoice") {
				const idx = o.index || 0;
				lit = () => { const p = ctx.param(b.id); return p && p.index == idx; };
				if (!w.label) nameEl.textContent = (b.param.options || [])[idx] || nameEl.textContent;
				press(node, () => ctx.set(b.id, idx));
			} else {
				const v = o.value != null ? Number(o.value) : (b.param.max != null ? b.param.max : 1);
				lit = () => { const p = ctx.param(b.id); return p && Math.abs(p.value - v) < 1e-6; };
				press(node, () => ctx.set(b.id, v));
			}
		} else {
			press(node, () => {});
		}
		const update = () => node.classList.toggle("on", !!lit());
		if (fbId != null) ctx.watch(fbId, update);
		return { node: node, update: update, missing: !b.ok && !!w.bind };
	};

	W.fader = function (w, ctx) {
		const o = w.opts || {};
		const b = bind(ctx, w.bind);
		const horiz = o.orientation == "h";
		const node = el("div", "rw-fader" + (horiz ? " h" : ""), '<span class="rw-name"></span><div class="rw-track"><div class="rw-fill"></div><div class="rw-cap"></div></div><span class="rw-num"></span>');
		node.querySelector(".rw-name").textContent = w.label || ctx.labelOf(w.bind) || "Fader";
		const fill = node.querySelector(".rw-fill"), cap = node.querySelector(".rw-cap"), num = node.querySelector(".rw-num");
		const track = node.querySelector(".rw-track");
		let dragging = false;
		const show = (x) => {
			if (horiz) { fill.style.width = x * 100 + "%"; fill.style.height = "100%"; cap.style.left = "calc(" + x * 100 + "% - 4px)"; }
			else { fill.style.height = x * 100 + "%"; cap.style.bottom = "calc(" + x * 100 + "% - 4px)"; }
		};
		const update = () => {
			if (b.id == null) { show(0.5); num.textContent = ""; return; }
			const p = ctx.param(b.id);
			if (!dragging) show(norm(p));
			num.textContent = o.showValue === false ? "" : fmt(p);
		};
		if (b.id != null) {
			const send = throttled((v) => ctx.set(b.id, v));
			drag(track, (e, r) => {
				dragging = true;
				const x = horiz ? (e.clientX - r.left) / r.width : 1 - (e.clientY - r.top) / r.height;
				const p = ctx.param(b.id);
				const v = fromNorm(p, x);
				show(norm({ value: v, min: p.min, max: p.max }));
				num.textContent = fmt({ valuetype: p.valuetype, value: v, min: p.min, max: p.max, view: p.view });
				send(v);
			}, () => { dragging = false; });
			doubleTap(track, () => ctx.reset(b.id));
			ctx.watch(b.id, update);
		}
		return { node: node, update: update, missing: !b.ok && !!w.bind };
	};

	W.knob = function (w, ctx) {
		const b = bind(ctx, w.bind);
		const node = el("div", "rw-knob", '<span class="rw-name"></span><svg viewBox="0 0 100 100"><path class="rw-arc-bg" d=""/><path class="rw-arc" d=""/></svg><span class="rw-num"></span>');
		node.querySelector(".rw-name").textContent = w.label || ctx.labelOf(w.bind) || "Knob";
		const arc = node.querySelector(".rw-arc"), bg = node.querySelector(".rw-arc-bg"), num = node.querySelector(".rw-num");
		const A0 = -135, A1 = 135;
		function path(a0, a1) {
			const r = 40, cx = 50, cy = 54;
			const p = (a) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
			const s = p(a0), e = p(a1);
			return "M" + s[0].toFixed(2) + " " + s[1].toFixed(2) + " A" + r + " " + r + " 0 " + (a1 - a0 > 180 ? 1 : 0) + " 1 " + e[0].toFixed(2) + " " + e[1].toFixed(2);
		}
		bg.setAttribute("d", path(A0, A1));
		let local = null;
		const show = (x) => arc.setAttribute("d", path(A0, A0 + Math.max(0.5, (A1 - A0) * x)));
		const update = () => {
			if (b.id == null) { show(0.5); num.textContent = ""; return; }
			const p = ctx.param(b.id);
			if (local == null) show(norm(p));
			num.textContent = fmt(p);
		};
		if (b.id != null) {
			const send = throttled((v) => ctx.set(b.id, v));
			let startX = 0;
			drag(node.querySelector("svg"), (e, r, start, first) => {
				const p = ctx.param(b.id);
				if (first) { startX = norm(p); local = startX; return; }
				local = Math.max(0, Math.min(1, startX + (start.y - e.clientY) / 200 + (e.clientX - start.x) / 400));
				show(local);
				const v = fromNorm(p, local);
				num.textContent = fmt({ valuetype: p.valuetype, value: v, min: p.min, max: p.max, view: p.view });
				send(v);
			}, () => { local = null; });
			doubleTap(node.querySelector("svg"), () => ctx.reset(b.id));
			ctx.watch(b.id, update);
		}
		return { node: node, update: update, missing: !b.ok && !!w.bind };
	};

	W.xy = function (w, ctx) {
		const bx = bind(ctx, w.bind), by = bind(ctx, w.bind2);
		const node = el("div", "rw-xy", '<span class="rw-name"></span><div class="rw-pad"><div class="rw-dot"></div></div>');
		node.querySelector(".rw-name").textContent = w.label || (ctx.labelOf(w.bind) + " / " + ctx.labelOf(w.bind2));
		const dot = node.querySelector(".rw-dot"), pad = node.querySelector(".rw-pad");
		let dragging = false;
		const show = (x, y) => { dot.style.left = x * 100 + "%"; dot.style.top = (1 - y) * 100 + "%"; };
		const update = () => {
			if (dragging) return;
			show(bx.id != null ? norm(ctx.param(bx.id)) : 0.5, by.id != null ? norm(ctx.param(by.id)) : 0.5);
		};
		const sx = throttled((v) => ctx.set(bx.id, v)), sy = throttled((v) => ctx.set(by.id, v));
		drag(pad, (e, r) => {
			dragging = true;
			const x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), y = Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height));
			show(x, y);
			if (bx.id != null) sx(fromNorm(ctx.param(bx.id), x));
			if (by.id != null) sy(fromNorm(ctx.param(by.id), y));
		}, () => { dragging = false; });
		if (bx.id != null) ctx.watch(bx.id, update);
		if (by.id != null) ctx.watch(by.id, update);
		return { node: node, update: update, missing: (!bx.ok && !!w.bind) || (!by.ok && !!w.bind2) };
	};

	W.choice = function (w, ctx) {
		const b = bind(ctx, w.bind);
		const node = el("div", "rw-choice", '<span class="rw-name"></span><div class="rw-opts"></div>');
		node.querySelector(".rw-name").textContent = w.label || ctx.labelOf(w.bind) || "Selector";
		const box = node.querySelector(".rw-opts");
		const opts = b.param ? b.param.options || [] : ["A", "B", "C"];
		const buttons = opts.map((name, i) => {
			const btn = el("div", "rw-opt");
			btn.textContent = name;
			if (b.id != null) press(btn, () => ctx.set(b.id, i));
			box.appendChild(btn);
			return btn;
		});
		const update = () => {
			const p = b.id != null ? ctx.param(b.id) : null;
			buttons.forEach((btn, i) => btn.classList.toggle("on", !!p && p.index == i));
		};
		if (b.id != null) ctx.watch(b.id, update);
		return { node: node, update: update, missing: !b.ok && !!w.bind };
	};

	// Rejilla con los clips de una capa
	W.clipgrid = function (w, ctx) {
		const o = Object.assign({ layer: 1, first: 1, count: 8, cols: 8, thumbs: true }, w.opts || {});
		const node = el("div", "rw-clipgrid");
		node.style.gridTemplateColumns = "repeat(" + Math.max(1, o.cols) + ", 1fr)";
		const parts = [];
		for (let i = 0; i < o.count; i++) {
			const sub = part(W.button({ bind: "/composition/layers/" + o.layer + "/clips/" + (o.first + i) + "/connect", opts: { thumb: o.thumbs } }, ctx));
			sub.node.classList.add("rw-clip");
			node.appendChild(sub.node);
			parts.push(sub);
		}
		const missing = !ctx.resolve("/composition/layers/" + o.layer + "/clear");
		return { node: node, update: () => parts.forEach((p) => p.update()), missing: missing };
	};

	W.columns = function (w, ctx) {
		const o = Object.assign({ first: 1, count: 8, cols: 8 }, w.opts || {});
		const node = el("div", "rw-clipgrid rw-columns");
		node.style.gridTemplateColumns = "repeat(" + Math.max(1, o.cols) + ", 1fr)";
		const parts = [];
		for (let i = 0; i < o.count; i++) {
			const path = "/composition/columns/" + (o.first + i) + "/connect";
			const r = ctx.resolve(path);
			const name = r && r.target && r.target.name ? r.target.name.value : "Columna " + (o.first + i);
			const sub = part(W.button({ bind: path, label: name, opts: { thumb: false } }, ctx));
			node.appendChild(sub.node);
			parts.push(sub);
		}
		return { node: node, update: () => parts.forEach((p) => p.update()) };
	};

	W.tempo = function (w, ctx) {
		const T = "/composition/tempocontroller/";
		const node = el("div", "rw-tempo");
		const v = part(W.value({ bind: T + "tempo", label: w.label || "BPM" }, ctx));
		v.node.classList.add("rw-bpm");
		node.appendChild(v.node);
		const row = el("div", "rw-row");
		const btn = (bindPath, label, opts) => { const b = part(W.button({ bind: bindPath, label: label, opts: opts }, ctx)); row.appendChild(b.node); return b; };
		const parts = [v, btn(T + "tempo_tap", "TAP"), btn(T + "resync", "RESYNC"), btn(T + "tempo_pull", "−"), btn(T + "tempo_push", "+")];
		// ÷2 y ×2: el valor del BPM se calcula al pulsar
		const tb = bind(ctx, T + "tempo");
		["÷2", "×2"].forEach((name, i) => {
			const b = el("div", "rw rw-button", '<span class="rw-name">' + name + "</span>");
			if (tb.id != null) press(b, () => { const p = ctx.param(tb.id); ctx.set(tb.id, i ? p.value * 2 : p.value / 2); });
			row.appendChild(b);
		});
		node.appendChild(row);
		return { node: node, update: () => parts.forEach((p) => p.update()), missing: v.missing };
	};

	W.layer = function (w, ctx) {
		const o = Object.assign({ layer: 1, fader: "opacity" }, w.opts || {});
		const L = "/composition/layers/" + o.layer;
		const node = el("div", "rw-layer");
		const r = ctx.resolve(L + "/clear");
		const name = el("div", "rw-lname");
		name.textContent = w.label || (r && r.target && r.target.name && r.target.name.value) || "Capa " + o.layer;
		node.appendChild(name);
		const f = part(W.fader({ bind: L + (o.fader == "master" ? "/master" : "/video/opacity"), label: o.fader == "master" ? "Master" : "Opacidad" }, ctx));
		node.appendChild(f.node);
		const row = el("div", "rw-row");
		const parts = [f];
		[[L + "/bypassed", "BYP"], [L + "/solo", "SOLO"], [L + "/clear", "CLR"]].forEach((x) => {
			const b = part(W.button({ bind: x[0], label: x[1] }, ctx));
			row.appendChild(b.node);
			parts.push(b);
		});
		node.appendChild(row);
		return { node: node, update: () => parts.forEach((p) => p.update()), missing: !r };
	};

	R.widget = function (w, ctx) {
		const make = W[w.type] || W.label;
		const inst = make(w, ctx);
		inst.node.classList.add("rw");
		if (w.color) inst.node.style.setProperty("--acc", w.color);
		if (inst.missing) inst.node.classList.add("missing");
		inst.update();
		return inst;
	};

	// ---------- página ----------

	// Dibuja una página del remote en `container`. conn = Connection (o null en el editor).
	// Devuelve {destroy, nodes: [{w, node}]}
	R.renderPage = function (container, layout, page, conn, opts) {
		opts = opts || {};
		const comp = (conn && conn.composition) || opts.composition || null;
		const tree = (conn && conn.tree) || opts.tree || null;
		const watchers = [];
		// sin conexión (editor) los valores salen de la composición tal cual
		const local = {};
		(function index(o) {
			if (conn || !o || typeof o != "object") return;
			if (Array.isArray(o)) { o.forEach(index); return; }
			if (typeof o.valuetype == "string" && o.id !== undefined) local[o.id] = o;
			Object.keys(o).forEach((k) => { if (k != "options") index(o[k]); });
		})(comp);
		if (!conn && tree && CS) CS.walk(tree).forEach((e) => { const r = CS.resolve(tree, e.path); if (r) local[r.param.id] = r.param; });
		const ctx = {
			resolve: (path) => R.resolve(comp, tree, path),
			param: (id) => (conn ? conn.param(id) : local[id]) || null,
			labelOf: (path) => labelOf(comp, path, tree),
			watch: (id, fn) => { if (conn) watchers.push(conn.on(id, fn)); },
			set: (id, v) => { if (conn) conn.set(id, v); },
			reset: (id) => { if (conn) conn.reset(id); },
			trigger: (path, v) => { if (conn) conn.trigger(path, v); },
			thumbUrl: (clip) => (conn ? conn.thumbUrl(clip) : "")
		};
		container.innerHTML = "";
		container.classList.add("rgrid");
		container.style.gridTemplateColumns = "repeat(" + layout.cols + ", 1fr)";
		container.style.gridTemplateRows = "repeat(" + layout.rows + ", 1fr)";
		const nodes = [];
		(page.widgets || []).forEach((w) => {
			const inst = R.widget(w, ctx);
			inst.node.style.gridColumn = (w.x + 1) + " / span " + w.w;
			inst.node.style.gridRow = (w.y + 1) + " / span " + w.h;
			inst.node.dataset.wid = w.id;
			container.appendChild(inst.node);
			nodes.push({ w: w, node: inst.node, inst: inst });
		});
		return {
			nodes: nodes,
			destroy: () => { watchers.forEach((off) => off()); container.innerHTML = ""; }
		};
	};

	// Nombre corto de una ruta, para etiquetas automáticas
	function labelOf(comp, path, tree) {
		if (!path) return "";
		if (CS && CS.isPath(path)) {
			const n = CS.node(tree, CS.address(path));
			return (n && n.DESCRIPTION) || CS.address(path).split("/").pop();
		}
		const parts = String(path).split("/").filter(Boolean).map((s) => decodeURIComponent(s));
		const last = parts[parts.length - 1];
		if (last == "connect" && parts[1] == "layers") {
			const r = comp && C.resolve(comp, path);
			const n = r && r.target && r.target.name && r.target.name.value;
			return n || "L" + parts[2] + " · " + parts[4];
		}
		if (last == "connect" && parts[1] == "columns") return "Columna " + parts[2];
		if (last == "clear") return "Vaciar";
		if (last == "select") return "Seleccionar";
		if (last == "disconnect-all") return "Limpiar todo";
		let where = "";
		if (parts[1] == "layers") {
			const r = comp && comp.layers && comp.layers[parseInt(parts[2], 10) - 1];
			where = (r && r.name && r.name.value) || "Capa " + parts[2];
			if (parts[3] == "clips") where += " " + parts[4];
		}
		return (where ? where + " · " : "") + C.label(last);
	}
	R.labelOf = labelOf;

	// CSS de los controles (compartido por el remote y el constructor)
	R.CSS = `
.rgrid{display:grid;gap:6px;width:100%;height:100%;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
.rw{--acc:#ffb000;position:relative;min-width:0;min-height:0;border-radius:8px;background:#1d1f23;border:1px solid #2c3036;color:#e8e9eb;
 font:12px/1.2 "Segoe UI",system-ui,sans-serif;box-sizing:border-box;overflow:hidden}
.rw.missing{border-color:#ff5a52;border-style:dashed}
.rw .rw-name{display:block;font-size:11px;color:#aab0b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-label{display:flex;align-items:center;padding:0 10px;font-size:15px;font-weight:600;background:transparent;border-color:transparent}
.rw-value{display:flex;flex-direction:column;justify-content:center;padding:4px 10px}
.rw-value .rw-big{font-size:clamp(14px,3.2vmin,28px);font-weight:700;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-button{display:flex;align-items:flex-end;justify-content:flex-start;padding:6px 8px;cursor:pointer;background:#24272c;transition:background .08s}
.rw-button .rw-name{position:relative;z-index:1;color:#e8e9eb;font-weight:600;font-size:12px;text-shadow:0 0 3px #000}
.rw-button.on{background:var(--acc);border-color:var(--acc)}
.rw-button.on .rw-name{color:#111;text-shadow:none}
.rw-button.down{filter:brightness(1.35)}

.rw-button.on .rw-thumb{opacity:.35}

.rw-fader .rw-name,.rw-fader .rw-num{text-align:center}
.rw-fader .rw-num{font-size:11px;color:var(--acc);min-height:13px}
.rw-track{position:relative;flex:1;background:#101113;border-radius:6px;cursor:pointer;overflow:hidden;min-height:20px}
.rw-fill{position:absolute;left:0;right:0;bottom:0;background:var(--acc);opacity:.22}
.rw-cap{position:absolute;left:0;right:0;height:8px;background:var(--acc);border-radius:3px}

.rw-fader.h .rw-cap{top:0;bottom:0;width:8px;height:auto;right:auto}

 background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px);background-size:25% 25%}

.rw-lamp i{flex-shrink:0;width:18px;height:18px;border-radius:50%;background:#2b2e33;border:1px solid #3a3e45}
.rw-lamp.on i{background:var(--acc);border-color:var(--acc);box-shadow:0 0 10px var(--acc)}

`;
})(window.RemoteRuntime = {});
</script>
<script>// Constructor de Resolume Remote (pestaña «Resolume Remote» del configurador).
// Arrastrar controles y parámetros al lienzo, asistente, prueba con simulador o con Resolume
// y exportación a un remote.html que se abre en el móvil o la tablet.
(function () {
	"use strict";

	const C = window.RemoteCatalog, L = window.RemoteLayout, R = window.RemoteRuntime, SIM = window.ResolumeSim, CS = window.ChataigneSource;
	// app.js define window.APCApp después de cargar este archivo: se busca al usarlo
	const APP = new Proxy({}, { get: (_, k) => window.APCApp[k] });
	const DATA = window.APP_DATA;
	const $ = (id) => document.getElementById(id);
	const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
	const clone = (o) => JSON.parse(JSON.stringify(o));
	const store = {
		get(k, d) { try { const v = localStorage.getItem("apcres." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
		set(k, v) { try { localStorage.setItem("apcres." + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
	};

	const TYPE_INFO = {
		button: ["▣", "Lanza clips, columnas, tap, bypass… o pone un valor fijo."],
		fader: ["▮", "Opacidad, master, velocidad, volumen… cualquier valor con rango."],
		knob: ["◔", "Como un fader pero redondo: ideal para efectos."],
		xy: ["✛", "Dos parámetros a la vez con un dedo (por ejemplo posición X e Y)."],
		choice: ["☰", "Elegir una opción: modo de fusión, dirección, beat snap…"],
		clipgrid: ["▦", "Todos los clips de una capa, con miniaturas y estado."],
		columns: ["▥", "Lanzar columnas enteras."],
		layer: ["▤", "Una capa completa: opacidad, bypass, solo y vaciar."],
		tempo: ["♩", "BPM, tap, resync, ÷2 y ×2."],
		value: ["123", "Muestra un valor: BPM, estado de un clip, un texto de Chataigne…"],
		meter: ["▬", "Barra de nivel que solo muestra: audio, intensidad, tiempo de una secuencia…"],
		lamp: ["●", "Luz que se enciende con un sí/no o cuando un valor pasa de un umbral."],
		label: ["T", "Un título o una nota."]
	};
	const COLORS = ["#ffb000", "#ff5a52", "#38ff5c", "#00a9ff", "#ff00ff", "#ffffff", "#ff7f00", "#8e66ff"];

	let layout = L.normalize(store.get("remote", null) || defaultLayout());
	let rcomp = store.get("remoteComp", null);
	let compSource = store.get("remoteCompSource", "");
	let pageIdx = 0;
	let selId = null;
	let mode = "edit";          // edit | sim | live
	let conn = null, view = null;
	let history = [], future = [];
	let showAdvanced = false, search = "";
	let leftTab = "pieces";
	let paramSource = store.get("remoteParamSource", "resolume"); // resolume | chataigne
	let ctree = store.get("chataigneTree", null);
	let ctreeSource = store.get("chataigneTreeSource", "");
	let chataigneHost = store.get("chataigneHost", "127.0.0.1:42000");
	let dirHandle = null;

	function defaultLayout() {
		return { name: "Remote Deseo54", device: "tablet-h", pages: [{ name: "Principal", widgets: [] }] };
	}

	// Composición para diseñar: la leída de Resolume o una de ejemplo hecha con el mapa del APC
	function composition() {
		if (rcomp) return rcomp;
		const cfg = APP.getConfig(), names = APP.getComposition();
		const n = Math.max(5, ...Object.keys(cfg.layers).map(Number).filter((x) => x > 0));
		const layers = [];
		for (let i = 1; i <= n; i++) {
			const cl = names && names.layers[i - 1];
			layers.push({
				name: (cl && cl.name) || cfg.layers[i] || "Capa " + i,
				clips: cl ? cl.clips.map((c) => (c.empty ? "" : c.name || "Clip")) : Array.from({ length: 16 }, (_, j) => "Clip " + (j + 1))
			});
		}
		rcomp = C.skeleton({ name: "Ejemplo (" + cfg.name + ")", layers: layers });
		compSource = "ejemplo";
		return rcomp;
	}
	// Árbol de Chataigne: el leído o uno de ejemplo con los módulos del puente y los destinos
	function chataigneTree() {
		if (ctree) return ctree;
		ctree = CS.exampleTree(APP.getConfig());
		ctreeSource = "ejemplo";
		return ctree;
	}
	let entriesCache = null, entriesFor = null, entriesTree = null;
	function entries() {
		const comp = composition(), tree = chataigneTree();
		if (entriesFor !== comp || entriesTree !== tree) { entriesCache = C.walk(comp).concat(CS.walk(tree)); entriesFor = comp; entriesTree = tree; }
		return entriesCache;
	}
	function realComp() { return rcomp && compSource != "ejemplo" ? rcomp : null; }
	function realTree() { return ctree && ctreeSource != "ejemplo" ? ctree : null; }

	// ---------- historial ----------

	function save() { store.set("remote", layout); }
	function commit(fn, keepSel) {
		history.push(JSON.stringify(layout));
		if (history.length > 200) history.shift();
		future = [];
		fn();
		layout = L.normalize(layout);
		save();
		if (!keepSel && selId && !widget(selId)) selId = null;
		render();
	}
	function undo() { if (!history.length) return; future.push(JSON.stringify(layout)); layout = JSON.parse(history.pop()); save(); render(); }
	function redo() { if (!future.length) return; history.push(JSON.stringify(layout)); layout = JSON.parse(future.pop()); save(); render(); }

	function page() { return layout.pages[Math.min(pageIdx, layout.pages.length - 1)]; }
	function widget(id) { return page().widgets.find((w) => w.id == id) || null; }

	// ---------- DOM base ----------

	function buildShell() {
		const st = document.createElement("style");
		st.textContent = R.CSS;
		document.head.appendChild(st);
		$("remoteMode").innerHTML = `
			<aside id="rbLeft">
				<nav class="tabs" id="rbTabs">
					<button data-lt="pieces">Piezas</button><button data-lt="params">Parámetros</button><button data-lt="assist">Asistente</button>
				</nav>
				<div class="tabpane" id="rbPieces"></div>
				<div class="tabpane" id="rbParams"></div>
				<div class="tabpane" id="rbAssist"></div>
			</aside>
			<section id="rbCenter">
				<div class="rbbar">
					<input type="text" id="rbName" title="Nombre del remote">
					<select id="rbDevice" title="Pantalla de destino"></select>
					<span class="dim" id="rbGridInfo"></span>
					<span class="spacer"></span>
					<div class="seg" id="rbMode"><button data-m="edit">Editar</button><button data-m="sim">Probar</button><button data-m="live">Con Resolume</button></div>
				</div>
				<div class="rbbar" id="rbPages"></div>
				<div id="rbStage"><div id="rbFrame"><div id="rbGrid"></div><div id="rbDrop"></div></div></div>
				<div class="rbbar dim" id="rbHint"></div>
			</section>
			<aside id="rbRight"><div id="rbInspector" class="tabpane on"></div></aside>
			<dialog id="rbDialog"></dialog>`;
		$("rbDevice").innerHTML = Object.keys(L.DEVICES).map((k) => '<option value="' + k + '">' + L.DEVICES[k].name + "</option>").join("");
		$("rbTabs").onclick = (e) => { const b = e.target.closest("[data-lt]"); if (b) { leftTab = b.dataset.lt; renderLeft(); } };
		$("rbName").onchange = (e) => commit(() => { layout.name = e.target.value.trim() || "Mi remote"; });
		$("rbDevice").onchange = (e) => {
			const d = L.DEVICES[e.target.value];
			commit(() => {
				const had = layout.pages.some((p) => p.widgets.length);
				layout.device = e.target.value;
				if (had) L.rescale(layout, d.cols, d.rows); else { layout.cols = d.cols; layout.rows = d.rows; }
			});
			toast("Pantalla: " + d.name + ". Los controles se han recolocado; revisa el asistente por si algo queda pequeño.");
		};
		$("rbMode").onclick = (e) => { const b = e.target.closest("[data-m]"); if (b) setMode(b.dataset.m); };
		$("rbPages").onclick = onPagesClick;
		setupCanvas();
		window.addEventListener("resize", fitFrame);
		window.addEventListener("apc:composition", (e) => {
			rcomp = e.detail;
			compSource = "Resolume · " + new Date().toLocaleTimeString();
			if (!store.set("remoteComp", rcomp)) store.set("remoteComp", null);
			store.set("remoteCompSource", compSource);
			entriesFor = null;
			paramsKey = null;
			render();
		});
	}

	function toast(msg, err) { APP.toast(msg, err); }

	// ---------- render ----------

	function render() {
		if ($("remoteMode").hidden) return;
		$("rbName").value = layout.name;
		$("rbDevice").value = layout.device;
		$("rbGridInfo").textContent = layout.cols + "×" + layout.rows + " celdas";
		document.querySelectorAll("#rbMode button").forEach((b) => b.classList.toggle("on", b.dataset.m == mode));
		renderPages();
		renderCanvas();
		renderLeft();
		renderInspector();
		APP.setRemoteToolbar({ undo: history.length > 0, redo: future.length > 0 });
	}

	function renderPages() {
		$("rbPages").innerHTML = layout.pages.map((p, i) => '<button class="small' + (i == pageIdx ? " on" : "") + '" data-page="' + i + '">' + esc(p.name) + " <span class=\"dim\">" + p.widgets.length + "</span></button>").join("") +
			'<button class="small" data-act="addpage" title="Añadir página">+ Página</button>';
	}
	function onPagesClick(e) {
		const b = e.target.closest("button");
		if (!b) return;
		if (b.dataset.act == "addpage") {
			commit(() => { layout.pages.push({ name: "Página " + (layout.pages.length + 1), widgets: [] }); });
			pageIdx = layout.pages.length - 1;
			selId = null;
			render();
			return;
		}
		pageIdx = parseInt(b.dataset.page, 10);
		selId = null;
		render();
	}

	function fitFrame() {
		const stage = $("rbStage"), frame = $("rbFrame");
		if (!stage || $("remoteMode").hidden) return;
		const d = L.DEVICES[layout.device];
		const sw = stage.clientWidth - 24, sh = stage.clientHeight - 24;
		const s = Math.min(sw / d.w, sh / d.h, 1.4);
		frame.style.width = Math.max(200, d.w * s) + "px";
		frame.style.height = Math.max(150, d.h * s) + "px";
	}

	function renderCanvas() {
		fitFrame();
		if (view) view.destroy();
		if (conn) conn.clearListeners();
		const g = $("rbGrid");
		g.classList.toggle("editing", mode == "edit");
		g.style.setProperty("--acc", layout.accent);
		g.style.setProperty("--cols", layout.cols);
		g.style.setProperty("--rows", layout.rows);
		view = R.renderPage(g, layout, page(), mode == "edit" ? null : conn, { composition: composition(), tree: chataigneTree() });
		if (mode == "edit") {
			view.nodes.forEach((n) => {
				const ov = document.createElement("div");
				ov.className = "rb-ov" + (n.w.id == selId ? " sel" : "");
				ov.dataset.wid = n.w.id;
				ov.innerHTML = '<span class="rb-tag">' + esc(L.typeName(n.w.type)) + '</span><span class="rb-rs" data-rs="1"></span>';
				n.node.appendChild(ov);
			});
			if (!page().widgets.length) {
				const hint = document.createElement("div");
				hint.className = "rb-empty";
				hint.innerHTML = "Arrastra aquí controles (Piezas) o parámetros (Parámetros).<br>¿Prefieres que te lo monte? Abre el <strong>Asistente</strong>.";
				g.appendChild(hint);
			}
		}
		const issues = L.check(layout, realComp(), realTree()).filter((i) => i.page == pageIdx);
		$("rbHint").innerHTML = mode == "edit"
			? (issues.length ? '<span class="warn">⚠ ' + issues.length + " cosas que revisar en esta página (Asistente).</span> " : "") +
			"Arrastra para mover · esquina inferior derecha para cambiar el tamaño · Supr borra · Ctrl+D duplica · flechas mueven"
			: mode == "sim" ? "Modo prueba con el simulador: toca los controles. No se manda nada a Resolume."
				: '<span class="warn">Conectado de verdad: los controles mandan a ' + esc([conn && conn.resolume ? "Resolume" : "", conn && conn.chataigne ? "Chataigne" : ""].filter(Boolean).join(" y ")) + ".</span>";
	}

	// ---------- lienzo: soltar, mover y redimensionar ----------

	function cellAt(e) {
		const r = $("rbGrid").getBoundingClientRect();
		return {
			x: Math.max(0, Math.min(layout.cols - 1, Math.floor((e.clientX - r.left) / r.width * layout.cols))),
			y: Math.max(0, Math.min(layout.rows - 1, Math.floor((e.clientY - r.top) / r.height * layout.rows)))
		};
	}
	function showDrop(x, y, w, h, ok) {
		const d = $("rbDrop");
		if (x == null) { d.style.display = "none"; return; }
		d.style.display = "block";
		d.style.left = (x / layout.cols * 100) + "%";
		d.style.top = (y / layout.rows * 100) + "%";
		d.style.width = (w / layout.cols * 100) + "%";
		d.style.height = (h / layout.rows * 100) + "%";
		d.classList.toggle("bad", !ok);
	}

	function setupCanvas() {
		const g = $("rbGrid"), frame = $("rbFrame");
		frame.addEventListener("dragover", (e) => {
			if (mode != "edit") return;
			e.preventDefault();
			const c = cellAt(e);
			const t = dragType(e);
			const over = e.target.closest && e.target.closest("[data-wid]");
			if (t && t.path && over) { showDrop(null); highlightTarget(over.dataset.wid); return; }
			highlightTarget(null);
			const size = t ? sizeFor(t) : [2, 2];
			const x = Math.min(c.x, layout.cols - size[0]), y = Math.min(c.y, layout.rows - size[1]);
			showDrop(x, y, size[0], size[1], L.fits(page(), layout.cols, layout.rows, x, y, size[0], size[1]));
		});
		frame.addEventListener("dragleave", (e) => { if (!frame.contains(e.relatedTarget)) { showDrop(null); highlightTarget(null); } });
		frame.addEventListener("drop", (e) => {
			if (mode != "edit") return;
			e.preventDefault();
			showDrop(null);
			highlightTarget(null);
			const t = readDrag(e);
			if (!t) return;
			const over = e.target.closest && e.target.closest("[data-wid]");
			if (t.path && over) { bindTo(over.dataset.wid, t.path); return; }
			const c = cellAt(e);
			addWidget(t, c.x, c.y);
		});

		// mover / redimensionar
		let op = null;
		g.addEventListener("pointerdown", (e) => {
			if (mode != "edit") return;
			const ov = e.target.closest(".rb-ov");
			if (!ov) { if (e.target == g) { selId = null; render(); } return; }
			const w = widget(ov.dataset.wid);
			if (!w) return;
			e.preventDefault();
			if (selId != w.id) { selId = w.id; renderInspector(); g.querySelectorAll(".rb-ov").forEach((o) => o.classList.toggle("sel", o.dataset.wid == selId)); }
			const c = cellAt(e);
			op = { id: w.id, resize: !!e.target.dataset.rs, sx: c.x, sy: c.y, x: w.x, y: w.y, w: w.w, h: w.h, nx: w.x, ny: w.y, nw: w.w, nh: w.h, node: ov.parentNode };
			try { g.setPointerCapture(e.pointerId); } catch (err) { /* nada */ }
		});
		g.addEventListener("pointermove", (e) => {
			if (!op) return;
			const c = cellAt(e), w = widget(op.id);
			const min = L.minSize(w.type);
			let nx = op.x, ny = op.y, nw = op.w, nh = op.h;
			if (op.resize) { nw = Math.max(min[0], op.w + c.x - op.sx); nh = Math.max(min[1], op.h + c.y - op.sy); }
			else { nx = Math.max(0, Math.min(layout.cols - op.w, op.x + c.x - op.sx)); ny = Math.max(0, Math.min(layout.rows - op.h, op.y + c.y - op.sy)); }
			if (!L.fits(page(), layout.cols, layout.rows, nx, ny, nw, nh, op.id)) return; // solo posiciones libres
			op.nx = nx; op.ny = ny; op.nw = nw; op.nh = nh;
			op.node.style.gridColumn = (nx + 1) + " / span " + nw;
			op.node.style.gridRow = (ny + 1) + " / span " + nh;
		});
		const end = () => {
			if (!op) return;
			const o = op;
			op = null;
			if (o.nx != o.x || o.ny != o.y || o.nw != o.w || o.nh != o.h) commit(() => { const w = widget(o.id); w.x = o.nx; w.y = o.ny; w.w = o.nw; w.h = o.nh; }, true);
		};
		g.addEventListener("pointerup", end);
		g.addEventListener("pointercancel", end);
	}
	function highlightTarget(id) {
		document.querySelectorAll("#rbGrid .rb-ov").forEach((o) => o.classList.toggle("target", o.dataset.wid == id));
	}

	// Lo que se arrastra: {type} desde Piezas o {path} desde Parámetros
	let dragging = null;
	function dragType() { return dragging; }
	function readDrag(e) {
		if (dragging) { const d = dragging; dragging = null; return d; }
		try { return JSON.parse(e.dataTransfer.getData("application/json")); } catch (err) { return null; }
	}
	function sizeFor(t) {
		if (t.type) return [R.TYPES[t.type].w, R.TYPES[t.type].h].map((v, i) => Math.min(v, i ? layout.rows : layout.cols));
		const e = C.find(entries(), t.path);
		const type = R.typeFor(e);
		return [Math.min(R.TYPES[type].w, layout.cols), Math.min(R.TYPES[type].h, layout.rows)];
	}

	function addWidget(t, cx, cy) {
		let w;
		if (t.type) w = { type: t.type, opts: defaultOpts(t.type) };
		else {
			const e = C.find(entries(), t.path);
			w = { type: R.typeFor(e), bind: t.path, label: shortLabel(e), opts: {} };
			if (e && e.key == "phase") w.opts.orientation = "h";
		}
		const size = sizeFor(t);
		if (w.type == "fader" && w.opts.orientation == "h") { size[0] = Math.min(layout.cols, 4); size[1] = 1; }
		const spot = L.findSpot(page(), layout.cols, layout.rows, size[0], size[1], cx == null ? undefined : Math.min(cx, layout.cols - size[0]), cy == null ? undefined : Math.min(cy, layout.rows - size[1]))
			|| L.findSpot(page(), layout.cols, layout.rows, 1, 1);
		if (!spot) { toast("No queda sitio en esta página. Añade otra página o haz más pequeños los controles.", true); return; }
		w.x = spot.x; w.y = spot.y; w.w = size[0]; w.h = size[1]; w.id = L.uid();
		// si no cabe entero, se encoge hasta que quepa
		while ((w.w > 1 || w.h > 1) && !L.fits(page(), layout.cols, layout.rows, w.x, w.y, w.w, w.h)) { if (w.w >= w.h && w.w > 1) w.w--; else w.h--; }
		commit(() => { page().widgets.push(w); });
		selId = w.id;
		render();
		tipFor(w);
	}
	function defaultOpts(type) {
		const comp = composition();
		if (type == "clipgrid") return { layer: 1, first: 1, count: Math.min(8, (comp.layers[0] && comp.layers[0].clips.length) || 8), cols: 8, thumbs: true };
		if (type == "columns") return { first: 1, count: Math.min(8, comp.columns.length || 8), cols: 8 };
		if (type == "layer") return { layer: 1, fader: "opacity" };
		return {};
	}
	function shortLabel(e) {
		if (!e) return "";
		const g = e.group.split(" › ");
		const last = g[g.length - 1];
		if (e.kind == "action") return e.action == "connect" && /Clip/.test(last) ? last.replace(/^Clip \d+ · /, "") : e.label;
		return (/^(Capa|Columna|Clip|Efecto)/.test(last) ? last.replace(/^Capa \d+ · /, "").replace(/^Efecto /, "") + " · " : "") + e.label;
	}
	function bindTo(id, path) {
		const w = widget(id), e = C.find(entries(), path);
		if (!w || !e) return;
		const accepts = R.TYPES[w.type].accepts;
		if (!accepts.length) { toast("«" + L.typeName(w.type) + "» no se conecta a un parámetro: se configura en el panel de la derecha.", true); return; }
		if (accepts.indexOf(e.valuetype) < 0) {
			toast("Un " + L.typeName(w.type).toLowerCase() + " no sirve para «" + e.label + "» (" + vtName(e.valuetype) + "). Suéltalo en un hueco libre y se crea el control adecuado.", true);
			return;
		}
		commit(() => { const ww = widget(id); ww.bind = path; if (!ww.label) ww.label = shortLabel(e); });
		selId = id;
		render();
		toast("Conectado: " + e.group + " › " + e.label);
	}
	function tipFor(w) {
		const tips = {
			fader: "Fader creado. En el remote, doble toque = valor por defecto.",
			button: w.bind ? "" : "Botón creado. Arrástrale encima un parámetro o una acción (Parámetros) para conectarlo.",
			clipgrid: "Rejilla de clips: elige la capa y cuántos clips en el panel de la derecha.",
			xy: "Pad XY: necesita dos parámetros (horizontal y vertical) en el panel de la derecha."
		};
		if (tips[w.type]) $("rbHint").textContent = tips[w.type];
	}
	function vtName(vt) {
		return { ParamRange: "valor con rango", ParamBoolean: "sí/no", ParamEvent: "pulsador", ParamChoice: "opciones", ParamString: "texto", ParamText: "texto", ParamInteger: "número", ParamColor: "color", Action: "acción" }[vt] || vt;
	}

	// ---------- panel izquierdo ----------

	function renderLeft() {
		document.querySelectorAll("#rbTabs button").forEach((b) => b.classList.toggle("on", b.dataset.lt == leftTab));
		["pieces", "params", "assist"].forEach((k) => $("rb" + k.charAt(0).toUpperCase() + k.slice(1)).classList.toggle("on", leftTab == k));
		if (leftTab == "pieces") renderPieces();
		if (leftTab == "params") renderParams();
		if (leftTab == "assist") renderAssist();
	}

	function renderPieces() {
		const el = $("rbPieces");
		el.innerHTML = '<p class="dim">Arrastra una pieza al lienzo (o haz clic para ponerla en el primer hueco).</p>' +
			L.WIDGET_TYPES.map((t) => '<div class="rb-piece" draggable="true" data-type="' + t + '"><span class="ico">' + TYPE_INFO[t][0] + "</span><div><strong>" + esc(L.typeName(t)) + '</strong><div class="hint">' + esc(TYPE_INFO[t][1]) + "</div></div></div>").join("");
		el.querySelectorAll(".rb-piece").forEach((p) => {
			p.addEventListener("dragstart", (e) => { dragging = { type: p.dataset.type }; e.dataTransfer.setData("application/json", JSON.stringify(dragging)); e.dataTransfer.effectAllowed = "copy"; });
			p.addEventListener("dragend", () => { dragging = null; showDrop(null); });
			p.addEventListener("click", () => { if (mode != "edit") setMode("edit"); addWidget({ type: p.dataset.type }); });
		});
	}

	let paramsKey = null;
	function renderParams(force) {
		const el = $("rbParams");
		const key = [entriesFor && entriesFor.name && entriesFor.name.value, compSource, ctreeSource, paramSource, search, showAdvanced, entries().length].join("|");
		if (!force && key == paramsKey && el.innerHTML) return;
		paramsKey = key;
		const isCha = paramSource == "chataigne";
		const list = entries().filter((e) => (e.source == "chataigne") == isCha && (showAdvanced || !e.advanced) && (!search || (e.group + " " + e.label + " " + e.path).toLowerCase().indexOf(search.toLowerCase()) >= 0));
		const groups = [];
		const byGroup = {};
		list.forEach((e) => { if (!byGroup[e.group]) { byGroup[e.group] = []; groups.push(e.group); } byGroup[e.group].push(e); });
		const seg = '<div class="seg" id="rbSrc" style="margin-bottom:8px"><button data-src="resolume"' + (isCha ? "" : ' class="on"') + '>Resolume</button><button data-src="chataigne"' + (isCha ? ' class="on"' : "") + ">Chataigne</button></div>";
		let src;
		if (!isCha) {
			src = (compSource == "ejemplo" || !compSource
				? '<p class="warn" style="font-size:12px">Usando una composición de ejemplo hecha con tu mapa. Lee la de Resolume para tener todos los efectos y parámetros reales.</p>'
				: '<p class="ok" style="font-size:12px">Composición: ' + esc(compSource) + "</p>") +
				'<div class="row"><button class="small" id="rbRead">Leer de Resolume</button><button class="small" id="rbLoad">Cargar archivo…</button></div>';
		} else {
			src = (ctreeSource == "ejemplo" || !ctreeSource
				? '<p class="warn" style="font-size:12px">Usando un Chataigne de ejemplo. Léelo de verdad para ver tus módulos (Sunlite, Resolume…), variables, estados y secuencias.</p>'
				: '<p class="ok" style="font-size:12px">Chataigne: ' + esc(ctreeSource) + "</p>") +
				'<div class="row"><input type="text" id="rbChaHost" value="' + esc(chataigneHost) + '" title="IP:puerto del OSC Remote Control de Chataigne"><button class="small fixed" id="rbReadCha">Leer de Chataigne</button></div>' +
				'<p class="hint">En Chataigne: <strong>Archivo → Preferencias → OSC Remote Control</strong>, actívalo (puerto 42000).</p>';
		}
		el.innerHTML = seg + src +
			'<div class="row" style="margin:8px 0"><input type="text" id="rbSearch" placeholder="Buscar: opacidad, blur, tap…" value="' + esc(search) + '"></div>' +
			'<label class="check" style="margin-bottom:8px"><input type="checkbox" id="rbAdv"' + (showAdvanced ? " checked" : "") + "> Mostrar avanzados</label>" +
			'<p class="hint">Arrástralos a un hueco (crea el control) o encima de un control (lo conecta). Clic = conectar al control elegido.</p>' +
			'<div id="rbTree">' + (groups.length ? "" : '<p class="dim">Nada coincide con la búsqueda.</p>') +
			groups.map((g) => {
				const open = search || groups.length < 8 || /^(Composición|Tempo|Crossfader)$|^Chataigne › Variables/.test(g);
				return "<details" + (open ? " open" : "") + "><summary>" + esc(g) + ' <span class="dim">' + byGroup[g].length + "</span></summary>" +
					byGroup[g].map((e) => '<div class="rb-param" draggable="true" data-path="' + esc(e.path) + '" title="' + esc(e.path + (C.HELP[e.key] ? "\n" + C.HELP[e.key] : "")) + '">' +
						"<span>" + esc(e.label) + '</span><span class="vt">' + esc(vtName(e.valuetype)) + "</span></div>").join("") + "</details>";
			}).join("") + "</div>";
		$("rbSrc").onclick = (e) => { const b = e.target.closest("[data-src]"); if (b) { paramSource = b.dataset.src; store.set("remoteParamSource", paramSource); renderParams(true); } };
		if (!isCha) {
			$("rbRead").onclick = readFromResolume;
			$("rbLoad").onclick = () => APP.openCompositionFile();
		} else {
			$("rbChaHost").onchange = (e) => { chataigneHost = e.target.value.trim() || "127.0.0.1:42000"; store.set("chataigneHost", chataigneHost); };
			$("rbReadCha").onclick = readFromChataigne;
		}
		const s = $("rbSearch");
		s.oninput = () => { search = s.value; const pos = s.selectionStart; renderParams(true); const n = $("rbSearch"); n.focus(); n.setSelectionRange(pos, pos); };
		$("rbAdv").onchange = (e) => { showAdvanced = e.target.checked; renderParams(true); };
		el.querySelectorAll(".rb-param").forEach((p) => {
			p.addEventListener("dragstart", (e) => { dragging = { path: p.dataset.path }; e.dataTransfer.setData("application/json", JSON.stringify(dragging)); e.dataTransfer.effectAllowed = "copy"; });
			p.addEventListener("dragend", () => { dragging = null; showDrop(null); highlightTarget(null); });
			p.addEventListener("click", () => {
				if (mode != "edit") setMode("edit");
				const w = selId && widget(selId);
				if (w && R.TYPES[w.type].accepts.length) bindTo(w.id, p.dataset.path);
				else addWidget({ path: p.dataset.path });
			});
		});
	}

	async function readFromChataigne() {
		try {
			toast("Leyendo Chataigne en " + chataigneHost + "…");
			const r = await fetch("http://" + chataigneHost + "/", { cache: "no-store" });
			const tree = await r.json();
			if (!tree || !tree.CONTENTS) throw new Error("no parece Chataigne");
			ctree = tree;
			ctreeSource = chataigneHost + " · " + new Date().toLocaleTimeString();
			if (!store.set("chataigneTree", ctree)) store.set("chataigneTree", null);
			store.set("chataigneTreeSource", ctreeSource);
			entriesFor = null; paramsKey = null;
			render();
			toast("Chataigne leído: " + CS.walk(ctree).length + " parámetros.");
		} catch (e) {
			toast("No se pudo leer Chataigne en " + chataigneHost + ". ¿Está abierto con OSC Remote Control activado (Preferencias)?", true);
		}
	}

	async function readFromResolume() {
		const cfg = APP.getConfig();
		const host = cfg.resolume.host + ":" + cfg.resolume.apiPort;
		try {
			toast("Leyendo la composición de " + host + "…");
			const comp = await R.fetchComposition(host, 6000);
			APP.setComposition(comp);
		} catch (e) {
			toast(e.message + ". Comprueba que Resolume está abierto con el Webserver activado, o carga la composición desde un archivo.", true);
		}
	}

		const comp = rcomp && compSource != "ejemplo" ? rcomp : null;

		if (total && !issues.some((i) => i.level == "error")) steps.push("Pulsa <strong>Probar</strong> arriba para tocarlo con el simulador.");
		if (total) steps.push("Cuando te guste, <strong>Exportar remote</strong> y ábrelo en la tablet.");
		$("rbAssist").innerHTML =
			'<button class="primary" id="rbWizard" style="width:100%">✨ Crear un remote paso a paso</button>' +
			'<p class="hint">Eliges qué quieres controlar y lo monta solo. Después puedes moverlo y cambiarlo todo.</p>' +
			"<h3>Siguientes pasos</h3><ol class=\"hint\" style=\"padding-left:18px\">" + steps.map((s) => "<li>" + s + "</li>").join("") + "</ol>" +
			"<h3>Revisión (" + issues.length + ")</h3>" +
			(issues.length ? issues.map((it, n) => '<div class="box rb-issue">' + icon[it.level] + " " + esc(it.msg) +
				'<div class="row" style="margin-top:6px">' + (it.widget ? '<button class="small fixed" data-go="' + n + '">Ir</button>' : "") +
				(it.fix == "fit" ? '<button class="small fixed" data-fit="1">Encajar en la pantalla</button>' : "") + "</div></div>").join("")
				: '<p class="ok">✔ Todo en orden.</p>') +
			"<h3>Trucos</h3><ul class=\"hint\" style=\"padding-left:18px\">" +
			"<li>Suelta un parámetro <em>encima</em> de un control para conectarlo; en un hueco crea el control que le va.</li>" +
			"<li>Un botón conectado a un valor con rango pone un valor fijo (p. ej. opacidad 0 = apagar capa).</li>" +
			"<li>Los efectos se guardan por nombre: si los reordenas en Resolume, el remote sigue funcionando.</li>" +
			"<li>Las capas y clips van por número: si los mueves, vuelve a leer la composición y revisa esta lista.</li></ul>";
		$("rbWizard").onclick = openWizard;
		$("rbAssist").querySelectorAll("[data-go]").forEach((b) => {
			b.onclick = () => { const it = issues[+b.dataset.go]; pageIdx = it.page; selId = it.widget; if (mode != "edit") setMode("edit"); render(); };
		});
